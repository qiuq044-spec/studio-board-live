function collectApplicationData(type){
  if(type==='expense') return {
    reason:document.getElementById('a_expense_reason').value.trim(),
    amount:document.getElementById('a_expense_amount').value,
    category:document.getElementById('a_expense_category').value,
    expectedPaymentDate:document.getElementById('a_expense_paydate').value,
    note:document.getElementById('a_expense_note').value.trim(),
  };
  if(type==='project') return {
    projectName:document.getElementById('a_project_name').value.trim(),
    backgroundGoal:document.getElementById('a_project_goal').value.trim(),
    resources:document.getElementById('a_project_resources').value.trim(),
    startDate:document.getElementById('a_project_start').value,
    endDate:document.getElementById('a_project_end').value,
    expectedOutcome:document.getElementById('a_project_outcome').value.trim(),
  };
  if(type==='leave') return {
    leaveType:document.getElementById('a_leave_type').value,
    reason:document.getElementById('a_leave_reason').value.trim(),
    startTime:document.getElementById('a_leave_start').value,
    endTime:document.getElementById('a_leave_end').value,
    location:document.getElementById('a_leave_location').value.trim(),
    note:document.getElementById('a_leave_note').value.trim(),
  };
  return {
    background:document.getElementById('a_collab_bg').value.trim(),
    purpose:document.getElementById('a_collab_purpose').value.trim(),
    request:document.getElementById('a_collab_request').value.trim(),
    deadline:document.getElementById('a_collab_deadline').value,
    benefit:document.getElementById('a_collab_benefit').value.trim(),
  };
}
function validateApplicationData(type,d){
  if(type==='expense'){
    if(!d.reason || !d.amount || Number(d.amount)<=0 || !d.expectedPaymentDate) return '请填写费用事由、有效金额和期望支付时间';
  }else if(type==='project'){
    if(!d.projectName || !d.backgroundGoal || !d.resources || !d.startDate || !d.endDate || !d.expectedOutcome) return '请完整填写项目立项信息';
    if(d.startDate>d.endDate) return '项目开始日期不能晚于结束日期';
  }else if(type==='leave'){
    if(!d.reason || !d.startTime || !d.endTime) return '请填写事由、开始时间和结束时间';
    if(d.startTime>d.endTime) return '开始时间不能晚于结束时间';
  }else{
    if(!d.purpose || !d.request || !d.deadline) return '请填写目的、具体需求和截止时间';
  }
  return '';
}
function openApplicationModal(){
  let selectedType = '';
  const applicantPerson = getPersonnel(identity);
  const approverCandidates = state.personnel.filter(p=>p.id!==identity);
  const defaultApprover = approverCandidates.find(p=>p.isAdmin)?.id || approverCandidates[0]?.id || '';
  openModal('发起申请', `
    <div class="application-type-picker">
      ${Object.entries(APPLICATION_TYPES).map(([key,m])=>`<button type="button" class="application-type-option" data-application-type="${key}">${escapeHtml(m.fullLabel)}</button>`).join('')}
    </div>
    <div id="applicationDynamicFields"></div>
    <div id="applicationCommonFields" class="application-common-fields">
      <div class="field-row">
        <div class="field"><label class="field-label">申请人</label>
          <div class="person-detail-readonly" id="a_applicant_display">${escapeHtml(applicantPerson?.name || identity || '当前账号')}</div>
          <input type="hidden" id="a_applicant" value="${escapeHtml(identity || '')}">
        </div>
        <div class="field"><label class="field-label">审批人</label>
          <select id="a_approver" ${approverCandidates.length?'':'disabled'}>${approverCandidates.length ? approverCandidates.map(p=>`<option value="${p.id}" ${defaultApprover===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('') : '<option value="">暂无其他成员可审批</option>'}</select>
        </div>
      </div>
      <div class="application-modal-note">申请提交后会自动生成通知；只有审批人本人身份可以同意或拒绝。</div>
    </div>
    <div class="modal-foot application-modal-foot">
      <button class="btn" id="applicationCancel">取消</button>
      <button class="btn btn-primary" id="applicationSubmit" disabled>提交申请</button>
    </div>
  `, ()=>{
    const fieldsHost = document.getElementById('applicationDynamicFields');
    const commonHost = document.getElementById('applicationCommonFields');
    const submitBtn = document.getElementById('applicationSubmit');
    document.getElementById('applicationCancel').onclick = closeModal;
    document.querySelectorAll('[data-application-type]').forEach(btn=>{
      btn.onclick = ()=>{
        selectedType = btn.dataset.applicationType;
        document.querySelectorAll('[data-application-type]').forEach(x=>x.classList.toggle('active',x===btn));
        fieldsHost.innerHTML = applicationFormFields(selectedType);
        commonHost.classList.add('show');
        submitBtn.disabled = false;
      };
    });
    submitBtn.onclick = async ()=>{
      if(!selectedType) return;
      const applicant = document.getElementById('a_applicant').value;
      const approver = document.getElementById('a_approver').value;
      if(!applicant || !approver){ showToast('请选择审批人'); return; }
      if(applicant===approver){ showToast('审批人不能选择申请人本人'); return; }
      const data = collectApplicationData(selectedType);
      const error = validateApplicationData(selectedType,data);
      if(error){ showToast(error); return; }
      const app = {id:'a_'+uid(), type:selectedType, data, applicant, approver, status:'待审批', ts:Date.now()};
      state.collaborations.push(app);
      const applicantName = getPersonnel(applicant)?.name || '成员';
      const approverName = getPersonnel(approver)?.name || '审批人';
      const typeLabel = applicationMeta(app).fullLabel;
      pushApplicationNotification(`${applicantName}提交了一条${typeLabel}，等待${approverName}审批`, app, approver);
      await saveData();
      closeModal();
      renderPage();
      showToast('申请已提交');
    };
  });
}

/* ============ 事件绑定 ============ */
function bindPageEvents(){
  const root = document.getElementById('pageRoot');
  if(!root) return;

  // ---- 主页：工具长按排序 ----
  bindDashboardToolSorting(root);

  // ---- 主页：工作室战略目标 ----
  root.querySelectorAll('[data-open-strategic-goals]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      openStrategicGoalsModal();
    };
  });
  root.querySelectorAll('[data-toggle-strategic-gantt]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.toggleStrategicGantt;
      if(expandedStrategicGantt.has(id)) expandedStrategicGantt.delete(id);
      else expandedStrategicGantt.add(id);
      renderPage();
    };
  });

  // ---- 项目管理：战略目标任务 / 历史归档 ----
  root.querySelectorAll('[data-project-workspace-strategic]').forEach(el=>{
    el.onclick = ()=>{ projectWorkspaceMode='strategic'; renderPage(); };
  });
  root.querySelectorAll('[data-open-strategy-archives]').forEach(el=>{
    el.onclick = ()=>openStrategicArchivesListModal();
  });
  root.querySelectorAll('[data-view-live-strategy]').forEach(el=>{
    el.onclick = ()=>openLiveStrategicTaskModal(el.dataset.viewLiveStrategy);
  });
  root.querySelectorAll('[data-complete-strategy]').forEach(el=>{
    el.onclick = ()=>{
      if(!isCurrentAdmin()){ showToast('仅管理员可确认归档'); return; }
      const goal=state.strategicGoals.find(item=>item.id===el.dataset.completeStrategy); if(!goal) return;
      confirmAction(`确认工作室目标「${goal.name}」已完成并归档吗？`, async ()=>{
        await archiveStrategicGoalById(goal.id,'确认完成',false);
        projectWorkspaceMode='strategic';
        renderPage();
        showToast('战略目标已归档');
      });
    };
  });
  root.querySelectorAll('[data-view-strategy-archive]').forEach(el=>{
    el.onclick = ()=>openStrategicArchiveModal(el.dataset.viewStrategyArchive);
  });
  root.querySelectorAll('[data-download-strategy-archive]').forEach(el=>{
    el.onclick = ()=>{
      const archive=state.strategicGoalArchives.find(item=>item.id===el.dataset.downloadStrategyArchive);
      if(archive) exportStrategicArchiveXlsx(archive);
    };
  });

  // ---- 项目管理 ----
  const btnAddProject = document.getElementById('btnAddProject');
  if(btnAddProject){
    btnAddProject.onclick = ()=>{
      projectWorkspaceMode = 'projects';
      const slot = document.getElementById('addProjectForm');
      if(slot.innerHTML){ slot.innerHTML=''; return; }
      slot.innerHTML = `
        <div class="inline-form" style="margin-bottom:16px;">
          <div class="inline-form-title">新建项目组</div>
          <div class="field"><input type="text" id="newProjName" placeholder="项目名称"></div>
          <div class="row-flex" style="justify-content:flex-end;">
            <button class="btn" id="cancelNewProj">取消</button>
            <button class="btn btn-primary" id="confirmNewProj">创建</button>
          </div>
        </div>
      `;
      document.getElementById('cancelNewProj').onclick = ()=>{ slot.innerHTML=''; };
      document.getElementById('confirmNewProj').onclick = async ()=>{
        const name = document.getElementById('newProjName').value.trim();
        if(!name){ showToast('请输入项目名称'); return; }
        const newProject = {id:'proj_'+uid(), name, completed:false, members:[]};
        state.projects.push(newProject);
        selectedProjectId = newProject.id;
        await saveData();
        slot.innerHTML='';
        renderPage();
        showToast('项目组已创建');
      };
    };
  }

  root.querySelectorAll('[data-select-project]').forEach(el=>{
    let projectClickTimer = null;
    el.onclick = (e)=>{
      if(e.detail > 1) return;
      clearTimeout(projectClickTimer);
      projectClickTimer = setTimeout(()=>{
        projectWorkspaceMode = 'projects';
        selectedProjectId = el.dataset.selectProject;
        renderPage();
      }, 220);
    };
    el.ondblclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      clearTimeout(projectClickTimer);
      projectWorkspaceMode = 'projects';
      const projectId = el.dataset.selectProject;
      const proj = state.projects.find(p=>p.id===projectId);
      if(!proj) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'current-project-rename-input';
      input.value = proj.name;
      input.setAttribute('aria-label', '修改项目名称');
      el.replaceWith(input);
      input.focus();
      input.select();

      let finished = false;
      const finishRename = async (save)=>{
        if(finished) return;
        if(!save){
          finished = true;
          renderPage();
          return;
        }
        const nextName = input.value.trim();
        if(!nextName){
          showToast('项目名称不能为空');
          setTimeout(()=>{ input.focus(); input.select(); }, 0);
          return;
        }
        finished = true;
        if(nextName !== proj.name){
          proj.name = nextName;
          await saveData();
          showToast('项目名称已更新');
        }
        renderPage();
      };

      input.onkeydown = (ev)=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); finishRename(true); }
        else if(ev.key === 'Escape'){ ev.preventDefault(); finishRename(false); }
      };
      input.onblur = ()=>finishRename(true);
    };
  });

  root.querySelectorAll('[data-toggle-proj]').forEach(el=>{
    el.onclick = ()=>{
      toggleProjectOpen(el.dataset.toggleProj);
      renderPage();
    };
  });
  root.querySelectorAll('[data-archive-proj]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const id = el.dataset.archiveProj;
      const proj = state.projects.find(p=>p.id===id);
      if(!proj) return;
      proj.completed = true;
      state.notifications.push({id:'n_'+uid(), content:`项目「${proj.name}」已归档`, type:'project', ts:Date.now()});
      await saveData();
      renderPage();
      showToast('项目已归档');
    };
  });
  root.querySelectorAll('[data-restore-proj]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const id = el.dataset.restoreProj;
      const proj = state.projects.find(p=>p.id===id);
      if(!proj) return;
      proj.completed = false;
      await saveData();
      renderPage();
      showToast('项目已恢复');
    };
  });
  root.querySelectorAll('[data-del-proj]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.delProj;
      const proj = state.projects.find(p=>p.id===id);
      confirmAction(`确定删除项目组「${proj?proj.name:''}」吗？删除后不可恢复。`, async ()=>{
        state.projects = state.projects.filter(p=>p.id!==id);
        await saveData();
        renderPage();
        showToast('项目组已删除');
      });
    };
  });
  root.querySelectorAll('[data-del-member]').forEach(el=>{
    el.onclick = async ()=>{
      const [pid, mid] = el.dataset.delMember.split('|');
      const proj = state.projects.find(p=>p.id===pid);
      proj.members = proj.members.filter(m=>m.id!==mid);
      await saveData();
      renderPage();
    };
  });
  root.querySelectorAll('[data-toggle-addgoal]').forEach(el=>{
    el.onclick = async ()=>{
      const [pid, mid] = el.dataset.toggleAddgoal.split('|');
      const proj = state.projects.find(p=>p.id===pid);
      const m = proj && proj.members.find(mm=>mm.id===mid);
      if(!m) return;

      const newGoal = {
        id:'g_'+uid(),
        content:'新目标',
        startDate:todayISO(),
        deadline:addDays(14),
        status:'待开始',
        progress:0,
        priority:'一般'
      };
      m.goals.push(newGoal);
      await saveData();
      renderPage();

      // 直接生成正式目标卡片，并立即进入名称编辑；其余字段均使用默认值，可在卡片上直接调整。
      setTimeout(()=>{
        const nameEl = document.querySelector(`[data-goal-rename="${pid}|${mid}|${newGoal.id}"]`);
        if(nameEl){
          nameEl.dispatchEvent(new MouseEvent('dblclick', {bubbles:true, cancelable:true}));
        }
      }, 0);
    };
  });
  root.querySelectorAll('[data-dashboard-goal-progress]').forEach(el=>{
    const [pid, mid, gid] = el.dataset.dashboardGoalProgress.split('|');
    const proj = state.projects.find(p=>p.id===pid);
    const m = proj && proj.members.find(m=>m.id===mid);
    const g = m && m.goals.find(g=>g.id===gid);
    if(!g) return;

    const updateVisual = ()=>{
      const p = Math.max(0, Math.min(100, Number(el.value)||0));
      el.style.setProperty('--p', `${p}%`);
      const valueEl = root.querySelector(`[data-dashboard-progress-value="${el.dataset.dashboardGoalProgress}"]`);
      if(valueEl) valueEl.textContent = `${Math.round(p)}%`;
    };

    // 记录拖到 100% 前最后一个数值；取消完成时恢复到这里（通常为 99%）。
    el.dataset.lastBeforeComplete = String(Math.min(99, goalProgressValue(g)));
    updateVisual();

    el.oninput = ()=>{
      const p = Math.max(0, Math.min(100, Number(el.value)||0));
      if(p < 100) el.dataset.lastBeforeComplete = String(p);
      updateVisual();
    };

    el.onchange = async ()=>{
      const p = Math.max(0, Math.min(100, Number(el.value)||0));

      if(p >= 100){
        const restoreP = Math.max(0, Math.min(99, Number(el.dataset.lastBeforeComplete)||0));
        const modalRoot = document.getElementById('modalRoot');
        modalRoot.innerHTML = `
          <div class="modal-mask open" id="progressCompleteMask">
            <div class="modal">
              <div class="modal-title">确认完成</div>
              <div style="font-size:12.5px; color:var(--text-primary); line-height:1.65; margin-bottom:2px;">确认「${escapeHtml(g.content)}」已完成并归档吗？</div>
              <div class="modal-foot">
                <button class="btn" id="progressCompleteNo">否</button>
                <button class="btn btn-primary" id="progressCompleteYes">是</button>
              </div>
            </div>
          </div>
        `;

        const restoreProgress = async ()=>{
          g.progress = restoreP;
          g.status = statusFromProgress(restoreP);
          delete g.completedAt;
          el.value = String(restoreP);
          updateVisual();
          await saveData();
          closeModal();
        };

        document.getElementById('progressCompleteNo').onclick = restoreProgress;
        document.getElementById('progressCompleteYes').onclick = async ()=>{
          g.progress = 100;
          g.status = '已完成';
          g.completedAt = Date.now();
          await saveData();
          closeModal();
          renderPage();
          showToast('目标已完成，已归入已完成目标');
        };
        document.getElementById('progressCompleteMask').onclick = async (evt)=>{
          if(evt.target.id === 'progressCompleteMask') await restoreProgress();
        };
        return;
      }

      g.progress = p;
      g.status = statusFromProgress(p);
      delete g.completedAt;
      el.dataset.lastBeforeComplete = String(p);
      await saveData();
    };
  });
  root.querySelectorAll('[data-goal-rename]').forEach(el=>{
    el.ondblclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const [pid, mid, gid] = el.dataset.goalRename.split('|');
      const proj = state.projects.find(p=>p.id===pid);
      const member = proj && proj.members.find(mm=>mm.id===mid);
      const goal = member && member.goals.find(gg=>gg.id===gid);
      if(!goal) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'goal-inline-rename-input';
      input.value = goal.content;
      input.setAttribute('aria-label', '修改目标名称');
      el.replaceWith(input);
      input.focus();
      input.select();

      let finished = false;
      const finishRename = async (save)=>{
        if(finished) return;
        if(!save){
          finished = true;
          renderPage();
          return;
        }
        const nextContent = input.value.trim();
        if(!nextContent){
          showToast('目标名称不能为空');
          setTimeout(()=>{ input.focus(); input.select(); }, 0);
          return;
        }
        finished = true;
        if(nextContent !== goal.content){
          goal.content = nextContent;
          await saveData();
          showToast('目标名称已更新');
        }
        renderPage();
      };

      input.onclick = (ev)=>ev.stopPropagation();
      input.ondblclick = (ev)=>ev.stopPropagation();
      input.onkeydown = (ev)=>{
        if(ev.key === 'Enter'){ ev.preventDefault(); finishRename(true); }
        else if(ev.key === 'Escape'){ ev.preventDefault(); finishRename(false); }
      };
      input.onblur = ()=>finishRename(true);
    };
  });
  root.querySelectorAll('[data-goal-dates]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const [pid, mid, gid] = el.dataset.goalDates.split('|');
      openGoalDatesModal(pid, mid, gid);
    };
  });
  root.querySelectorAll('[data-goal-priority]').forEach(el=>{
    el.onclick = (e)=> e.stopPropagation();
    el.onchange = async ()=>{
      const [pid, mid, gid] = el.dataset.goalPriority.split('|');
      const proj = state.projects.find(p=>p.id===pid);
      const m = proj && proj.members.find(m=>m.id===mid);
      const g = m && m.goals.find(g=>g.id===gid);
      if(!g) return;
      g.priority = el.value;
      await saveData();
      renderPage();
      showToast('优先级已更新');
    };
  });
  root.querySelectorAll('[data-goal-strategy]').forEach(el=>{
    el.onclick = (e)=>e.stopPropagation();
    el.onchange = async ()=>{
      const [pid, mid, gid] = el.dataset.goalStrategy.split('|');
      const proj = state.projects.find(p=>p.id===pid);
      const m = proj && proj.members.find(member=>member.id===mid);
      const g = m && m.goals.find(goal=>goal.id===gid);
      if(!g) return;
      const nextId = el.value || '';
      if(nextId){
        if(g.strategicGoalId!==nextId) g.strategicLinkedAt = Date.now();
        g.strategicGoalId = nextId;
      }else{
        delete g.strategicGoalId;
        delete g.strategicLinkedAt;
      }
      await saveData();
      renderPage();
      showToast(nextId ? `已关联「${strategicGoalName(nextId)}」` : '已取消战略目标关联');
    };
  });
  root.querySelectorAll('[data-goal-status]').forEach(el=>{
    el.onclick = (e)=> e.stopPropagation();
    el.onchange = async ()=>{
      const [pid, mid, gid] = el.dataset.goalStatus.split('|');
      const proj = state.projects.find(p=>p.id===pid);
      const m = proj.members.find(m=>m.id===mid);
      const g = m.goals.find(g=>g.id===gid);
      const wasCompleted = g.status === '已完成';
      g.status = el.value;
      if(g.status === '已完成' && !wasCompleted) g.completedAt = Date.now();
      if(g.status !== '已完成') delete g.completedAt;
      await saveData();
      renderPage();
      showToast(g.status==='已完成' ? '目标已完成，已归入已完成目标' : '进度已更新');
    };
  });
  root.querySelectorAll('[data-del-goal]').forEach(el=>{
    el.onclick = async ()=>{
      const [pid, mid, gid] = el.dataset.delGoal.split('|');
      const proj = state.projects.find(p=>p.id===pid);
      const m = proj.members.find(m=>m.id===mid);
      m.goals = m.goals.filter(g=>g.id!==gid);
      await saveData();
      renderPage();
    };
  });
  root.querySelectorAll('[data-toggle-donegoals]').forEach(el=>{
    el.onclick = ()=>{
      const [pid, mid] = el.dataset.toggleDonegoals.split('|');
      openDoneGoalsModal(pid, mid);
    };
  });

  // ---- 个人信息 ----
  if(currentPage==='profile'){
    const person = getPersonnel(identity);
    const profileChangePasswordBtn = document.getElementById('profileChangePassword');
    if(profileChangePasswordBtn) profileChangePasswordBtn.onclick = openProfilePasswordModal;
    if(person){
      const avatarFile = document.getElementById('profileAvatarFile');
      const openAvatarPicker = ()=>avatarFile && avatarFile.click();
      const avatarBtn = document.getElementById('profileAvatarButton');
      const avatarChange = document.getElementById('profileAvatarChange');
      if(avatarBtn) avatarBtn.onclick = openAvatarPicker;
      if(avatarChange) avatarChange.onclick = openAvatarPicker;
      if(avatarFile) avatarFile.onchange = async ()=>{
        const file = avatarFile.files && avatarFile.files[0];
        if(!file) return;
        try{
          person.avatar = await compressAvatarFile(file);
          await saveData();
          renderPage();
          showToast('头像已更新');
        }catch(err){ showToast(err?.message || '头像更新失败'); }
      };
      const avatarReset = document.getElementById('profileAvatarReset');
      if(avatarReset) avatarReset.onclick = async ()=>{
        person.avatar = '';
        await saveData();
        renderPage();
        showToast('已恢复默认头像');
      };

      const statusSelect = document.getElementById('profileStatus');
      if(statusSelect) statusSelect.onchange = async ()=>{
        person.status = statusSelect.value || '工作中';
        await saveData();
        renderPage();
        showToast(`状态已切换为「${person.status}」`);
      };

      const profileContact = document.getElementById('profileContact');
      if(profileContact){
        let contactBefore = person.contact || '';
        const saveProfileContact = async ()=>{
          const next = profileContact.value.trim();
          if(next === contactBefore) return;
          person.contact = next;
          contactBefore = next;
          await saveData();
          showToast('联系方式已更新');
        };
        profileContact.onblur = saveProfileContact;
        profileContact.onkeydown = e=>{
          if(e.key==='Enter'){ e.preventDefault(); profileContact.blur(); }
          else if(e.key==='Escape'){ e.preventDefault(); profileContact.value = contactBefore; profileContact.blur(); }
        };
      }

      const profileSignatureDisplay = document.getElementById('profileSignatureDisplay');
      if(profileSignatureDisplay){
        profileSignatureDisplay.onclick = ()=>{
          if(document.getElementById('profileSignatureEditor')) return;
          const signatureBefore = typeof person.signature === 'string' ? person.signature : '';
          const input = document.createElement('input');
          input.type = 'text';
          input.id = 'profileSignatureEditor';
          input.className = 'profile-signature-editor';
          input.maxLength = 160;
          input.placeholder = '个性签名';
          input.value = signatureBefore;
          profileSignatureDisplay.replaceWith(input);
          input.focus();
          if(signatureBefore) input.setSelectionRange(input.value.length, input.value.length);
          let canceled = false;
          input.onkeydown = e=>{
            if(e.key==='Enter'){
              e.preventDefault();
              input.blur();
            }else if(e.key==='Escape'){
              e.preventDefault();
              canceled = true;
              input.value = signatureBefore;
              input.blur();
            }
          };
          input.onblur = async ()=>{
            const next = canceled ? signatureBefore : input.value.trim();
            if(!canceled && next !== signatureBefore){
              person.signature = next;
              await saveData();
              showToast('个性签名已保存');
            }
            renderPage();
          };
        };
      }

      const profileName = document.getElementById('profileName');
      if(profileName) profileName.ondblclick = ()=>{
        if(profileName.dataset.editing==='1') return;
        profileName.dataset.editing = '1';
        const oldName = person.name;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'profile-name-edit';
        input.value = oldName;
        profileName.replaceWith(input);
        input.focus(); input.select();
        let done = false;
        const finish = async (save)=>{
          if(done) return; done = true;
          const next = input.value.trim();
          if(save && next && next!==oldName){
            syncPersonName(person,next);
            await saveData();
            showToast('姓名已更新');
          }
          renderApp();
        };
        input.onkeydown = e=>{
          if(e.key==='Enter'){e.preventDefault();finish(true);}
          else if(e.key==='Escape'){e.preventDefault();finish(false);}
        };
        input.onblur = ()=>finish(true);
      };

      root.querySelectorAll('[data-profile-tag]').forEach(tagEl=>{
        tagEl.ondblclick = (e)=>{
          if(e.target.closest('[data-profile-tag-remove]')) return;
          const index = Number(tagEl.dataset.profileTag);
          if(!Number.isInteger(index) || !person.tags[index]) return;
          const old = person.tags[index];
          const textEl = tagEl.querySelector('.profile-tag-text');
          if(!textEl) return;
          const input = document.createElement('input');
          input.type='text'; input.className='profile-tag-edit'; input.value=old;
          textEl.replaceWith(input); input.focus(); input.select();
          let done=false;
          const finish = async (save)=>{
            if(done) return; done=true;
            const next=input.value.trim();
            if(save && next && next!==old){
              if(person.tags.some((t,i)=>i!==index && t.toLowerCase()===next.toLowerCase())){
                showToast('这个标签已经存在');
              }else{
                person.tags[index]=next;
                await saveData();
                showToast('标签已更新');
              }
            }
            renderPage();
          };
          input.onclick=e=>e.stopPropagation();
          input.ondblclick=e=>e.stopPropagation();
          input.onkeydown=e=>{
            if(e.key==='Enter'){e.preventDefault();finish(true);}
            else if(e.key==='Escape'){e.preventDefault();finish(false);}
          };
          input.onblur=()=>finish(true);
        };
      });
      root.querySelectorAll('[data-profile-tag-remove]').forEach(btn=>{
        btn.onclick = async (e)=>{
          e.stopPropagation();
          const index=Number(btn.dataset.profileTagRemove);
          if(!Number.isInteger(index)) return;
          person.tags.splice(index,1);
          await saveData();
          renderPage();
          showToast('标签已删除');
        };
      });
      const tagAdd = document.getElementById('profileTagAdd');
      if(tagAdd) tagAdd.onclick = ()=>{
        if(person.tags.length>=6){showToast('个人标签最多 6 个');return;}
        openModal('添加个人标签', `
          <div class="field"><label class="field-label">标签名称</label><input type="text" id="newProfileTag" maxlength="12" placeholder="输入标签名称"></div>
          <div class="modal-foot"><button class="btn" id="cancelProfileTag">取消</button><button class="btn btn-primary" id="saveProfileTag">添加</button></div>
        `, ()=>{
          const input=document.getElementById('newProfileTag');
          document.getElementById('cancelProfileTag').onclick=closeModal;
          document.getElementById('saveProfileTag').onclick=async ()=>{
            const tag=input.value.trim();
            if(!tag){showToast('请输入标签名称');return;}
            if(person.tags.some(t=>t.toLowerCase()===tag.toLowerCase())){showToast('这个标签已经存在');return;}
            person.tags.push(tag);
            await saveData();
            closeModal();
            renderPage();
            showToast('标签已添加');
          };
          input.onkeydown=e=>{if(e.key==='Enter') document.getElementById('saveProfileTag').click();};
          input.focus();
        });
      };
    }
  }

  // ---- 人员管理 ----
  const btnAddPerson = document.getElementById('btnAddPerson');
  if(btnAddPerson){
    btnAddPerson.onclick = ()=>openAddPersonModal();
  }
  root.querySelectorAll('[data-person-detail]').forEach(el=>{
    el.onclick = ()=>openPersonDetailModal(el.dataset.personDetail);
  });
  root.querySelectorAll('[data-person-status]').forEach(el=>{
    el.onchange = async ()=>{
      const p = getPersonnel(el.dataset.personStatus);
      if(!p) return;
      p.status = el.value || '工作中';
      await saveData();
      renderPage();
      showToast(`${p.name} · ${p.status}`);
    };
  });
  // ---- 协作及申请：统一申请系统 ----
  const btnDownloadApplications = document.getElementById('btnDownloadApplications');
  if(btnDownloadApplications) btnDownloadApplications.onclick = exportApplicationsTable;
  const btnAddApplication = document.getElementById('btnAddApplication');
  if(btnAddApplication) btnAddApplication.onclick = openApplicationModal;
  root.querySelectorAll('[data-app-scope]').forEach(el=>{
    el.onclick = ()=>{
      applicationScopeFilter = el.dataset.appScope || 'all';
      renderPage();
    };
  });
  const applicationStatusSelect = document.getElementById('applicationStatusFilter');
  if(applicationStatusSelect) applicationStatusSelect.onchange = ()=>{
    applicationStatusFilter = applicationStatusSelect.value || 'all';
    renderPage();
  };
  root.querySelectorAll('[data-toggle-collab]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.toggleCollab;
      if(expandedCollabs.has(id)) expandedCollabs.delete(id); else expandedCollabs.add(id);
      renderPage();
    };
  });
  root.querySelectorAll('[data-collab-act]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const [id, status] = el.dataset.collabAct.split('|');
      const c = state.collaborations.find(c=>c.id===id);
      if(!c) return;
      if(identity!==c.approver){ showToast('只有审批人本人可以处理这条申请'); return; }
      c.status = status;
      c.resolvedAt = Date.now();
      c.resolvedBy = identity;
      const applicantName = getPersonnel(c.applicant)?.name || '申请人';
      const typeLabel = applicationMeta(c).fullLabel;
      pushApplicationNotification(`${applicantName}的${typeLabel}${status==='已同意'?'已通过':'已被拒绝'}`, c, c.applicant);
      await saveData();
      renderPage();
      showToast(status==='已同意' ? '已同意申请' : '已拒绝申请');
    };
  });

  // ---- 工具管理 ----
  const btnManageToolCategories = document.getElementById('btnManageToolCategories');
  if(btnManageToolCategories) btnManageToolCategories.onclick = openToolCategoriesModal;

  const btnExportTools = document.getElementById('btnExportTools');
  if(btnExportTools) btnExportTools.onclick = exportToolsTable;

  const btnAddTool = document.getElementById('btnAddTool');
  if(btnAddTool) btnAddTool.onclick = ()=>openToolEditorModal(null);

  root.querySelectorAll('[data-tool-category-title]').forEach(title=>{
    title.ondblclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const category = state.toolCategories.find(c=>c.id===title.dataset.toolCategoryTitle);
      if(!category) return;
      const head = title.closest('.tool-category-panel-head');
      if(!head || head.querySelector('.tool-category-inline-edit')) return;

      const oldName = category.name;
      title.style.display = 'none';

      const editor = document.createElement('div');
      editor.className = 'tool-category-inline-edit';
      editor.innerHTML = `<input type="text" class="tool-category-inline-input" value="${escapeHtml(oldName)}" aria-label="分类标题">`;
      head.appendChild(editor);

      const input = editor.querySelector('.tool-category-inline-input');
      let settled = false;
      const restore = ()=>{
        if(settled) return;
        settled = true;
        editor.remove();
        title.style.display = '';
      };
      const submit = async ()=>{
        if(settled) return;
        const name = input.value.trim();
        if(!name){
          showToast('请输入分类名称');
          input.focus();
          return;
        }
        if(state.toolCategories.some(c=>c.id!==category.id && c.name.toLowerCase()===name.toLowerCase())){
          showToast('这个分类已经存在');
          input.focus();
          input.select();
          return;
        }
        settled = true;
        category.name = name;
        editor.remove();
        title.style.display = '';
        await saveData();
        renderPage();
        showToast('分类名称已更新');
      };
      input.onkeydown = (evt)=>{
        if(evt.key==='Enter'){ evt.preventDefault(); submit(); }
        if(evt.key==='Escape'){ evt.preventDefault(); restore(); }
      };
      input.onblur = ()=>{ submit(); };
      setTimeout(()=>{ input.focus(); input.select(); },0);
    };
  });

  root.querySelectorAll('[data-del-tool-category]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.delToolCategory;
      const category = state.toolCategories.find(c=>c.id===id);
      if(!category) return;
      const usedCount = state.tools.filter(t=>t.categoryId===id).length;
      const message = usedCount
        ? `确定删除分类「${category.name}」吗？该分类下的 ${usedCount} 个工具会移动到「未分类」，工具本身不会删除。`
        : `确定删除分类「${category.name}」吗？`;
      confirmAction(message, async ()=>{
        state.tools.forEach(t=>{ if(t.categoryId===id) t.categoryId=''; });
        state.toolCategories = state.toolCategories.filter(c=>c.id!==id);
        await saveData();
        renderPage();
        showToast(usedCount ? '分类已删除，工具已移至未分类' : '分类已删除');
      });
    };
  });

  root.querySelectorAll('[data-edit-tool]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      openToolEditorModal(el.dataset.editTool);
    };
  });
  root.querySelectorAll('[data-del-tool]').forEach(el=>{
    el.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const tool = state.tools.find(t=>t.id===el.dataset.delTool);
      if(!tool) return;
      confirmAction(`确定删除工具「${tool.name}」吗？`, async ()=>{
        state.tools = state.tools.filter(t=>t.id!==tool.id);
        await saveData();
        renderPage();
        showToast('工具已删除');
      });
    };
  });

  // ---- 团队公告 ----
  const btnSendNotify = document.getElementById('btnSendNotify');
  const notifyInput = document.getElementById('notifyInput');
  if(btnSendNotify && notifyInput){
    btnSendNotify.onclick = async ()=>{
      const content = notifyInput.value.trim();
      if(!content){ showToast('请输入公告内容'); return; }
      const author = identity ? getPersonnel(identity) : null;
      state.notifications.push({id:'n_'+uid(), content, type:'manual', ts:Date.now(), readBy: identity ? [identity] : [], authorId: identity || null, authorName: author?.name || (identity ? String(identity) : '未知用户'), authorAvatar: author?.avatar || ''});
      await saveData();
      notifyInput.value = '';
      renderPage();
      showToast('公告已发布');
    };
  }

  root.querySelectorAll('[data-edit-announcement]').forEach(el=>{
    el.onclick = ()=>{
      const item = state.notifications.find(n=>n.id===el.dataset.editAnnouncement && n.type==='manual');
      const card = el.closest('.announcement-item');
      if(!item || !card || card.classList.contains('editing')) return;

      const contentEl = card.querySelector('.announcement-content');
      const actionsEl = card.querySelector('.announcement-actions');
      if(!contentEl || !actionsEl) return;

      card.classList.add('editing');
      const editor = document.createElement('textarea');
      editor.className = 'announcement-inline-edit';
      editor.value = item.content || '';
      contentEl.replaceWith(editor);
      actionsEl.innerHTML = `
        <button type="button" class="announcement-action" data-cancel-inline-announcement>取消</button>
        <button type="button" class="announcement-action save" data-save-inline-announcement>保存</button>
      `;
      editor.focus();
      editor.setSelectionRange(editor.value.length, editor.value.length);

      const cancel = actionsEl.querySelector('[data-cancel-inline-announcement]');
      const save = actionsEl.querySelector('[data-save-inline-announcement]');
      if(cancel) cancel.onclick = ()=>renderPage();
      if(save) save.onclick = async ()=>{
        const next = editor.value.trim();
        if(!next){ showToast('公告内容不能为空'); return; }
        item.content = next;
        item.editedAt = Date.now();
        // 公告更新后，对其他成员重新变成未读；编辑者本人默认已读。
        item.readBy = identity ? [identity] : [];
        // 公告更新视为一次新的主页通知：若之前已读，重新标记为未读。
        readIds = readIds.filter(id=>id!==item.id);
        await saveReadIds();
        await saveData();
        renderPage();
        showToast('公告已更新');
      };
      editor.addEventListener('keydown', (evt)=>{
        if(evt.key==='Escape'){
          evt.preventDefault();
          renderPage();
        }
      });
    };
  });
  root.querySelectorAll('[data-clear-announcement]').forEach(el=>{
    el.onclick = ()=>{
      const item = state.notifications.find(n=>n.id===el.dataset.clearAnnouncement && n.type==='manual');
      if(!item) return;
      confirmAction('确定清除这条公告吗？', async ()=>{
        state.notifications = state.notifications.filter(n=>n.id!==item.id);
        await saveData();
        renderPage();
        showToast('公告已清除');
      });
    };
  });
}

init();
</script>

<script id="neo-global-date-picker-script">
(function(){
  const WEEK = ['日','一','二','三','四','五','六'];
  let picker = null;
  let active = null;
  let viewYear = 0, viewMonth = 0;
  let selected = null;
  let selectedHour = '09', selectedMinute = '00';

  const pad = n => String(n).padStart(2,'0');
  const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseDateValue = (value, kind) => {
    if(!value) return null;
    const raw = kind==='datetime-local' ? value.slice(0,10) : value;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
    if(!m) return null;
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    return Number.isNaN(d.getTime()) ? null : d;
  };
  const displayValue = (value, kind) => {
    if(!value) return kind==='datetime-local' ? '选择日期与时间' : '选择日期';
    if(kind==='datetime-local'){
      const [date,time=''] = value.split('T');
      return `${date.replaceAll('-','/')} ${time.slice(0,5)}`.trim();
    }
    return value.replaceAll('-','/');
  };
  const icon = `<svg class="neo-date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>`;

  function enhance(input){
    if(!input || input.dataset.neoDateEnhanced==='1') return;
    const kind = input.getAttribute('type');
    if(kind!=='date' && kind!=='datetime-local') return;
    input.dataset.neoDateEnhanced='1';
    input.dataset.neoDateKind=kind;

    const wrap=document.createElement('div');
    wrap.className='neo-date-wrap';
    input.parentNode.insertBefore(wrap,input);
    wrap.appendChild(input);
    input.classList.add('neo-date-native');

    const btn=document.createElement('button');
    btn.type='button';
    btn.className='neo-date-trigger';
    btn.innerHTML=`<span class="neo-date-value"></span>${icon}`;
    wrap.appendChild(btn);

    const sync=()=>{
      const span=btn.querySelector('.neo-date-value');
      span.textContent=displayValue(input.value,kind);
      btn.classList.toggle('empty',!input.value);
    };
    sync();
    input.addEventListener('change',sync);
    input.addEventListener('input',sync);
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      openPicker(input,btn);
    });
  }

  function enhanceAll(root=document){
    root.querySelectorAll?.('input[type="date"],input[type="datetime-local"]').forEach(enhance);
  }

  function setUnderlyingValue(input,value){
    input.value=value;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
  }

  function openPicker(input, trigger){
    closePicker();
    const kind=input.dataset.neoDateKind || input.getAttribute('type') || 'date';
    active={input,trigger,kind};
    const existing=parseDateValue(input.value,kind) || new Date();
    selected=new Date(existing.getFullYear(),existing.getMonth(),existing.getDate());
    viewYear=selected.getFullYear(); viewMonth=selected.getMonth();
    if(kind==='datetime-local' && input.value.includes('T')){
      const t=input.value.split('T')[1]||'';
      const [h='09',m='00']=t.split(':');
      selectedHour=pad(Math.min(23,Math.max(0,+h||0)));
      selectedMinute=pad(Math.min(59,Math.max(0,+m||0)));
    }else{
      const now=new Date(); selectedHour=pad(now.getHours()); selectedMinute=pad(Math.floor(now.getMinutes()/5)*5);
    }
    picker=document.createElement('div');
    picker.className='neo-date-picker';
    picker.addEventListener('click',e=>e.stopPropagation());
    document.body.appendChild(picker);
    renderPicker();
    positionPicker();
  }

  function positionPicker(){
    if(!picker || !active) return;
    const r=active.trigger.getBoundingClientRect();
    const pr=picker.getBoundingClientRect();
    let left=r.left;
    if(left+pr.width>window.innerWidth-12) left=window.innerWidth-pr.width-12;
    left=Math.max(12,left);
    let top=r.bottom+8;
    if(top+pr.height>window.innerHeight-12) top=r.top-pr.height-8;
    picker.style.left=`${left}px`;
    picker.style.top=`${Math.max(12,top)}px`;
  }

  function renderPicker(){
    if(!picker || !active) return;
    const first=new Date(viewYear,viewMonth,1);
    const start=new Date(viewYear,viewMonth,1-first.getDay());
    const today=new Date();
    const days=[];
    for(let i=0;i<42;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const isOther=d.getMonth()!==viewMonth;
      const isToday=isoDate(d)===isoDate(today);
      const isSelected=selected && isoDate(d)===isoDate(selected);
      days.push(`<button type="button" class="neo-date-day${isOther?' other':''}${isToday?' today':''}${isSelected?' selected':''}" data-neo-day="${isoDate(d)}">${d.getDate()}</button>`);
    }
    const hourOptions=Array.from({length:24},(_,i)=>`<option value="${pad(i)}" ${pad(i)===selectedHour?'selected':''}>${pad(i)}</option>`).join('');
    const minuteOptions=Array.from({length:12},(_,i)=>pad(i*5)).map(m=>`<option value="${m}" ${m===selectedMinute?'selected':''}>${m}</option>`).join('');
    picker.innerHTML=`
      <div class="neo-date-picker-head">
        <div class="neo-date-picker-title">${viewYear}年${viewMonth+1}月</div>
        <div class="neo-date-nav">
          <button type="button" data-neo-prev aria-label="上个月">‹</button>
          <button type="button" data-neo-next aria-label="下个月">›</button>
        </div>
      </div>
      <div class="neo-date-week">${WEEK.map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="neo-date-grid">${days.join('')}</div>
      <div class="neo-date-picker-foot">
        <button type="button" class="neo-date-foot-link" data-neo-clear>清除</button>
        <button type="button" class="neo-date-foot-link" data-neo-today>今天</button>
        <span class="neo-date-foot-spacer"></span>
        ${active.kind==='datetime-local' ? `<div class="neo-time-controls"><select class="neo-time-select" data-neo-hour>${hourOptions}</select><span class="neo-time-colon">:</span><select class="neo-time-select" data-neo-minute>${minuteOptions}</select></div><button type="button" class="neo-date-confirm" data-neo-confirm>确定</button>` : ''}
      </div>`;

    picker.querySelector('[data-neo-prev]').onclick=()=>{ viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderPicker(); positionPicker(); };
    picker.querySelector('[data-neo-next]').onclick=()=>{ viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderPicker(); positionPicker(); };
    picker.querySelectorAll('[data-neo-day]').forEach(btn=>{
      btn.onclick=()=>{
        const [y,m,d]=btn.dataset.neoDay.split('-').map(Number);
        selected=new Date(y,m-1,d); viewYear=y; viewMonth=m-1;
        if(active.kind==='date'){
          setUnderlyingValue(active.input,btn.dataset.neoDay);
          closePicker();
        }else{
          renderPicker(); positionPicker();
        }
      };
    });
    picker.querySelector('[data-neo-clear]').onclick=()=>{ setUnderlyingValue(active.input,''); closePicker(); };
    picker.querySelector('[data-neo-today]').onclick=()=>{
      selected=new Date(); viewYear=selected.getFullYear(); viewMonth=selected.getMonth();
      if(active.kind==='date'){ setUnderlyingValue(active.input,isoDate(selected)); closePicker(); }
      else { renderPicker(); positionPicker(); }
    };
    if(active.kind==='datetime-local'){
      picker.querySelector('[data-neo-hour]').onchange=e=>{selectedHour=e.target.value;};
      picker.querySelector('[data-neo-minute]').onchange=e=>{selectedMinute=e.target.value;};
      picker.querySelector('[data-neo-confirm]').onclick=()=>{
        setUnderlyingValue(active.input,`${isoDate(selected)}T${selectedHour}:${selectedMinute}`);
        closePicker();
      };
    }
  }

  function closePicker(){ if(picker){picker.remove();picker=null;} active=null; }
  document.addEventListener('click',closePicker);
  document.addEventListener('keydown',e=>{if(e.key==='Escape') closePicker();});
  window.addEventListener('resize',()=>{if(picker) positionPicker();});
  window.addEventListener('scroll',()=>{if(picker) positionPicker();},true);

  const observer=new MutationObserver(mutations=>{
    for(const m of mutations){
      for(const node of m.addedNodes){ if(node.nodeType===1){ if(node.matches?.('input[type="date"],input[type="datetime-local"]')) enhance(node); enhanceAll(node); } }
    }
  });
  observer.observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>enhanceAll());
  else enhanceAll();
})();
</script>
