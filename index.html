function getPersonCurrentProjects(person){
  return state.projects
    .filter(proj=>!proj.completed && proj.members.some(m=>m.personnelId===person.id || (!m.personnelId && m.name===person.name)))
    .map(proj=>proj.name);
}
function getPersonCurrentProjectIds(person){
  return state.projects
    .filter(proj=>!proj.completed && proj.members.some(m=>m.personnelId===person.id || (!m.personnelId && m.name===person.name)))
    .map(proj=>proj.id);
}
function personProjectPickerHtml(selectedIds, attrName){
  const activeProjects = state.projects.filter(p=>!p.completed);
  const selectedNames = activeProjects.filter(p=>selectedIds.has(p.id)).map(p=>p.name);
  const summary = selectedNames.length ? selectedNames.join('、') : (activeProjects.length ? '未选择项目' : '暂无项目');
  return `
    <button type="button" class="person-project-select-trigger" ${activeProjects.length?'':'disabled'}>
      <span class="person-project-select-value">${escapeHtml(summary)}</span>
      ${activeProjects.length ? '<span class="person-project-select-arrow">⌄</span>' : ''}
    </button>
    <div class="person-project-select-menu">
      ${activeProjects.length ? activeProjects.map(proj=>`
        <button type="button" class="person-project-select-item ${selectedIds.has(proj.id)?'selected':''}" ${attrName}="${proj.id}">
          <span>${escapeHtml(proj.name)}</span>
          <span class="person-project-select-state">${selectedIds.has(proj.id)?'已选':''}</span>
        </button>
      `).join('') : '<div class="person-project-select-empty">暂无项目</div>'}
    </div>`;
}
function bindPersonProjectSelect(pickerId, selectedProjectIds, attrName){
  const picker = document.getElementById(pickerId);
  if(!picker) return;
  const trigger = picker.querySelector('.person-project-select-trigger');
  const value = picker.querySelector('.person-project-select-value');
  const activeProjects = ()=>state.projects.filter(p=>!p.completed);
  const refresh = ()=>{
    const names = activeProjects().filter(p=>selectedProjectIds.has(p.id)).map(p=>p.name);
    if(value) value.textContent = names.length ? names.join('、') : (activeProjects().length ? '未选择项目' : '暂无项目');
    picker.querySelectorAll(`[${attrName}]`).forEach(btn=>{
      const id = btn.getAttribute(attrName);
      const selected = selectedProjectIds.has(id);
      btn.classList.toggle('selected', selected);
      const stateEl = btn.querySelector('.person-project-select-state');
      if(stateEl) stateEl.textContent = selected ? '已选' : '';
    });
  };
  if(trigger && !trigger.disabled){
    trigger.onclick = (e)=>{ e.stopPropagation(); picker.classList.toggle('open'); };
  }
  picker.querySelectorAll(`[${attrName}]`).forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute(attrName);
      if(selectedProjectIds.has(id)) selectedProjectIds.delete(id); else selectedProjectIds.add(id);
      refresh();
    };
  });
  const modal = picker.closest('.modal');
  if(modal) modal.addEventListener('click', (e)=>{ if(!picker.contains(e.target)) picker.classList.remove('open'); });
  refresh();
}

    return;

      <div class="field"><label class="field-label">姓名</label><input type="text" id="personDetailName" value="${escapeHtml(person.name)}"></div>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label">联系方式</label>
        <div class="person-detail-readonly" id="personDetailContactReadonly">${escapeHtml(person.contact || '—')}</div>
      </div>
      <div class="field">
        <label class="field-label">人员状态</label>
        <div class="person-detail-readonly" id="personDetailStatusReadonly">${escapeHtml(person.status || '工作中')}</div>
      </div>
    </div>
    <div class="field">
      <label class="field-label">个人标签</label>
      <div class="person-detail-readonly" id="personDetailTagsReadonly">${tags.length ? tags.map(escapeHtml).join('、') : '—'}</div>
    </div>

      <div class="field">
        <label class="field-label">管理员权限</label>
        <div class="person-detail-readonly" style="justify-content:space-between; gap:18px;">
          <span>${person.isAdmin?'管理员':'普通成员'}</span>
          ${(person.id===identity && person.isAdmin) ? `<button type="button" class="btn-text" id="transferAdminPermission" style="margin-left:auto; padding:0; color:var(--text-secondary); font-size:10.5px; font-weight:300; line-height:1;">转移权限</button>` : ''}
        </div>
      </div>

        <label class="field-label">项目归属</label>
        <div class="person-project-select" id="personDetailProjectPicker">${personProjectPickerHtml(selectedProjectIds, 'data-person-project')}</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelPersonDetail">取消</button>
      <button class="btn btn-primary" id="savePersonDetail">保存</button>
    </div>
  `, ()=>{
    const detailModal = document.querySelector('#modalRoot .modal');
    if(detailModal) detailModal.dataset.personDetailId = person.id;
    const avatarPreview = document.getElementById('personDetailAvatarPreview');
    const avatarFile = document.getElementById('personDetailAvatarFile');
    const renderAvatarPreview = ()=>{
      const name = document.getElementById('personDetailName').value.trim() || person.name || '?';
      avatarPreview.innerHTML = stagedAvatar
        ? `<div class="avatar person-edit-avatar" style="background:rgba(225,222,216,.72)"><img src="${escapeHtml(stagedAvatar)}" alt="${escapeHtml(name)}"></div>`
        : `<div class="avatar person-edit-avatar" style="background:${colorFor(name)}">${initials(name)}</div>`;
    };
    document.getElementById('personDetailAvatarChange').onclick = ()=>avatarFile.click();
    avatarFile.onchange = async ()=>{
      const file = avatarFile.files && avatarFile.files[0];
      if(!file) return;
      try{
        stagedAvatar = await compressAvatarFile(file);
        renderAvatarPreview();
      }catch(err){ showToast(err?.message || '头像处理失败'); }
      avatarFile.value='';
    };
    document.getElementById('personDetailName').addEventListener('input',()=>{ if(!stagedAvatar) renderAvatarPreview(); });
    const transferBtn = document.getElementById('transferAdminPermission');
    if(transferBtn) transferBtn.onclick = ()=>openAdminTransferModal(person.id);
    bindPersonProjectSelect('personDetailProjectPicker', selectedProjectIds, 'data-person-project');
    const deleteBtn = document.getElementById('deletePersonFromDetail');
    if(deleteBtn) deleteBtn.onclick = ()=>{
      if(person.id===identity && person.isAdmin){
        showToast('请先转移管理员权限，再删除自己');
        return;
      }
      confirmActionOverCurrent(`确定删除成员「${person.name}」吗？`, async ()=>{
        const removedId = person.id;
        const removedName = person.name;

        // 先删除认证账号，再删除人员档案，避免账号与人员状态分裂。
        try{ await detachAccountIdToBlankWorkspace(removedId); }catch(e){ showToast(e?.message || '删除成员账号失败'); return; }
        state.personnel = state.personnel.filter(p=>p.id!==removedId);

        // 级联清理所有项目中的该成员；成员下的阶段目标会随成员一并移除。
        state.projects.forEach(proj=>{
          proj.members = (proj.members || []).filter(m=>{
            if(m.personnelId===removedId) return false;
            // 兼容旧数据：早期成员记录可能没有 personnelId，只保存了姓名。
            if(!m.personnelId && m.name===removedName) return false;
            return true;
          });
        });

        // 同步移除与该成员直接关联的协作申请，避免残留无效人员引用。
        state.collaborations = (state.collaborations || []).filter(c=>c.applicant!==removedId && c.approver!==removedId);

        // 如果删除的是当前身份，自动切到剩余成员（优先管理员）。
        if(identity===removedId){
          await saveIdentity('');
        }

        await saveData();
        // 删除成功后退出人员编辑弹窗，回到人员管理列表。
        closeModal();
        currentPage = 'personnel';
        renderPage();
        showToast('成员及其项目工作信息已删除');
      });
    };
    document.getElementById('cancelPersonDetail').onclick = closeModal;
    document.getElementById('savePersonDetail').onclick = async ()=>{
      const oldId = person.id;
      const newId = document.getElementById('personDetailId').value.trim();
      const name = document.getElementById('personDetailName').value.trim();
      const position = document.getElementById('personDetailPosition').value.trim();
      if(!newId){ showToast('请输入人员 ID'); return; }
      if(!name){ showToast('请输入姓名'); return; }
      if(state.personnel.some(p=>p!==person && String(p.id).toLowerCase()===newId.toLowerCase())){
        showToast('这个人员 ID 已存在'); return;
      }
      if(newId !== oldId){
        await renameAccountIdInRegistry(oldId, newId);
        state.projects.forEach(proj=>proj.members.forEach(m=>{
          if(m.personnelId===oldId) m.personnelId = newId;
        }));
        state.collaborations.forEach(c=>{
          if(c.applicant===oldId) c.applicant = newId;
          if(c.approver===oldId) c.approver = newId;
        });
        if(identity===oldId) await saveIdentity(newId);
        person.id = newId;
      }
      if(name !== person.name) syncPersonName(person, name);
      person.position = position || '未设置';
      person.avatar = stagedAvatar;
      state.projects.forEach(proj=>(proj.members||[]).forEach(m=>{
        if(m.personnelId===person.id || (!m.personnelId && m.name===person.name)) m.role = person.position || '';
      }));

      // 人员的项目归属统一在人员管理中维护。
      state.projects.filter(proj=>!proj.completed).forEach(proj=>{
        const memberIndex = (proj.members || []).findIndex(m=>m.personnelId===person.id || (!m.personnelId && m.name===person.name));
        const shouldJoin = selectedProjectIds.has(proj.id);
        if(shouldJoin && memberIndex < 0){
          proj.members.push({
            id:'m_'+uid(),
            personnelId:person.id,
            name:person.name,
            role:person.position || '未设置',
            goals:[]
          });
        }else if(!shouldJoin && memberIndex >= 0){
          proj.members.splice(memberIndex, 1);
        }
      });

      await saveData();
      closeModal();
      renderApp();
      showToast('人员资料已更新');
    };
  });
}
function openAdminTransferModal(fromPersonId){
  const fromPerson = getPersonnel(fromPersonId);
  if(!fromPerson || identity!==fromPerson.id || !fromPerson.isAdmin || !isCurrentAdmin()){
    showToast('只能由管理员本人移交自己的权限');
    return;
  }
  const candidates = state.personnel.filter(p=>p.id!==fromPerson.id && !p.isAdmin);
  openModal('移交管理员权限', `
    <div class="field">
      <label class="field-label">接收成员</label>
      <select id="adminTransferTarget" ${candidates.length?'':'disabled'}>
        ${candidates.length ? candidates.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} · ${escapeHtml(p.position||'未设置')}</option>`).join('') : '<option value="">暂无可接收权限的成员</option>'}
      </select>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelAdminTransfer">取消</button>
      <button class="btn btn-primary" id="confirmAdminTransfer" ${candidates.length?'':'disabled'}>确认移交</button>
    </div>
  `, ()=>{
    document.getElementById('cancelAdminTransfer').onclick = closeModal;
    const confirmBtn = document.getElementById('confirmAdminTransfer');
    if(confirmBtn) confirmBtn.onclick = ()=>{
      const targetId = document.getElementById('adminTransferTarget').value;
      const target = getPersonnel(targetId);
      if(!target){ showToast('请选择接收成员'); return; }
      confirmAction(`确定将管理员权限移交给「${target.name}」吗？`, async ()=>{
        if(identity!==fromPerson.id || !fromPerson.isAdmin){
          showToast('当前已无权执行移交');
          return;
        }
        state.personnel.forEach(p=>{ p.isAdmin = p.id===target.id; });
        await saveData();
        closeModal();
        currentPage = 'notify';
        renderApp();
        showToast(`管理员权限已移交给 ${target.name}`);
      });
    };
  });
}

  ensureApplicationsData();
  let list = state.collaborations.slice();
  if(applicationScopeFilter==='mine') list = list.filter(c=>c.applicant===identity);
  if(applicationScopeFilter==='pending') list = list.filter(c=>c.approver===identity && c.status==='待审批');
  if(applicationStatusFilter!=='all') list = list.filter(c=>c.status===applicationStatusFilter);
  list.sort((a,b)=>(b.ts||0)-(a.ts||0));

  const pendingCount = state.collaborations.filter(c=>c.approver===identity && c.status==='待审批').length;
  return `
    <div class="page-head">

const STATUS_BADGE = {'待审批':'sb-pending','已同意':'sb-approved','已拒绝':'sb-rejected'};
function collabCard(c){
  const open = expandedCollabs.has(c.id);
  const applicant = getPersonnel(c.applicant);
  const approver = getPersonnel(c.approver);
  const meta = applicationMeta(c);
  const isApprover = identity===c.approver;
  return `
    <div class="collab-card application-card">
      <div class="collab-head" data-toggle-collab="${c.id}">
        <span class="caret" style="font-size:10px; color:var(--text-tertiary); transform:rotate(${open?90:0}deg); display:inline-block; width:10px;">▸</span>
        <span class="application-type-tag ${meta.cls}">${escapeHtml(meta.label)}</span>
        <span class="ttl">${escapeHtml(applicationTitle(c))}</span>
        <span class="application-head-meta">

/* ============ 工具管理 ============ */
function pageTools(){
  ensureToolData();
  // 看板只展示包含工具的分类；空分类仍保留在添加工具的分类选择中。
  const categorized = state.toolCategories.map(category=>({
    category,
    tools:state.tools.filter(t=>t.categoryId===category.id)
  })).filter(section=>section.tools.length);
  const uncategorized = state.tools.filter(t=>!t.categoryId || !state.toolCategories.some(c=>c.id===t.categoryId));
  const sections = [...categorized];
  if(uncategorized.length){
    sections.push({category:null, tools:uncategorized});
  }

  const renderToolRow = (tool, index)=>`
    <div class="tool-compact-row ${index===0?'first':''}">
      <div class="tool-compact-main">
        <a class="tool-compact-name" href="${escapeHtml(tool.url)}" target="_blank" rel="noopener" title="打开 ${escapeHtml(tool.name)}">${escapeHtml(tool.name)}</a>
        <div class="tool-compact-host">${escapeHtml(toolHost(tool.url))}</div>
      </div>
      <div class="tool-compact-actions">
        <button type="button" class="tool-board-action" data-edit-tool="${tool.id}">编辑</button>
        <button type="button" class="tool-board-action danger" data-del-tool="${tool.id}">删除</button>
      </div>
    </div>`;

  return `
    <div class="tool-dashboard-head">
      <div class="tool-dashboard-head-actions">
        <button class="btn btn-primary" id="btnAddTool">添加工具</button>
        <button class="btn" id="btnExportTools">下载表格</button>
      </div>
    </div>

    <div class="tool-board tool-board-memberlike">
      ${sections.length ? sections.map(({category,tools})=>`
        <section class="tool-category-panel">
          <div class="tool-category-panel-head">
            <span class="tool-category-avatar">${escapeHtml((category ? category.name : '未分类').trim().slice(0,1) || '工')}</span>
            <div class="tool-category-panel-title"${category ? ` data-tool-category-title="${category.id}" title="双击修改分类标题"` : ''}>${category ? escapeHtml(category.name) : '未分类'}</div>
          </div>
          <div class="tool-category-panel-list">
            ${tools.map((tool,index)=>renderToolRow(tool,index)).join('')}
          </div>
        </section>
      `).join('') : `<div class="tool-board-empty tool-board-empty-main">还没有工具。点击“添加工具”创建第一个工具。</div>`}
    </div>
  `;
}

function exportToolsTable(){
  ensureToolData();
  if(!state.tools.length){
    showToast('暂无工具可下载');
    return;
  }

  const categoryOrder = new Map(state.toolCategories.map((c,i)=>[c.id,i]));
  const rows = state.tools.slice().sort((a,b)=>{
    const ai = a.categoryId && categoryOrder.has(a.categoryId) ? categoryOrder.get(a.categoryId) : Number.MAX_SAFE_INTEGER;
    const bi = b.categoryId && categoryOrder.has(b.categoryId) ? categoryOrder.get(b.categoryId) : Number.MAX_SAFE_INTEGER;
    if(ai !== bi) return ai - bi;
    return (a.name||'').localeCompare(b.name||'', 'zh-CN');
  });

  // 生成真正的 .xlsx 文件（OOXML + ZIP，无第三方库）。
  const encoder = new TextEncoder();
  const xmlEscape = (value)=>String(value ?? '').replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'
  }[c]));
  const colName = (n)=>{
    let s='';
    while(n>0){ n--; s=String.fromCharCode(65 + (n%26)) + s; n=Math.floor(n/26); }
    return s;
  };
  const cell = (value, col, row, style=0)=>{
    const ref = `${colName(col)}${row}`;
    return `<c r="${ref}" t="inlineStr"${style ? ` s="${style}"` : ''}><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
  };

  const header = ['序号','工具名称','分类','网页网址'];
  const table = [header, ...rows.map((tool,index)=>[
    index + 1,
    tool.name || '',
    toolCategoryName(tool.categoryId),
    tool.url || ''
  ])];

  const sheetRows = table.map((r,ri)=>{
    const rowNum = ri + 1;
    return `<row r="${rowNum}" ht="${ri===0?24:22}" customHeight="1">${r.map((v,ci)=>cell(v,ci+1,rowNum,ri===0?1:0)).join('')}</row>`;
  }).join('');

  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
  <cols>
    <col min="1" max="1" width="9" customWidth="1"/>
    <col min="2" max="2" width="28" customWidth="1"/>
    <col min="3" max="3" width="22" customWidth="1"/>
    <col min="4" max="4" width="46" customWidth="1"/>
  </cols>
  <sheetData>${sheetRows}</sheetData>
  <autoFilter ref="A1:D${table.length}"/>
</worksheet>`;

  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets><sheet name="工具清单" sheetId="1" r:id="rId1"/></sheets>
</workbook>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <fonts count="2">
    <font><sz val="11"/><name val="Arial"/></font>
    <font><b/><sz val="11"/><name val="Arial"/></font>
  </fonts>
  <fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
  <borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs count="2">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center"/></xf>
    <xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>
  </cellXfs>
  <cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;

  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  // ZIP Store 模式打包，浏览器端直接生成，无依赖。
  const crcTable = (()=>{
    const table = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      table[n]=c>>>0;
    }
    return table;
  })();
  const crc32 = (bytes)=>{
    let c=0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++) c=crcTable[(c^bytes[i])&0xFF]^(c>>>8);
    return (c^0xFFFFFFFF)>>>0;
  };
  const u16 = (n)=>new Uint8Array([n&255,(n>>>8)&255]);
  const u32 = (n)=>new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]);
  const concat = (parts)=>{
    const len=parts.reduce((s,p)=>s+p.length,0), out=new Uint8Array(len);
    let off=0; parts.forEach(p=>{out.set(p,off); off+=p.length;});
    return out;
  };
  const zipFiles = [
    ['[Content_Types].xml', contentTypes],
    ['_rels/.rels', rootRels],
    ['xl/workbook.xml', workbookXml],
    ['xl/_rels/workbook.xml.rels', workbookRels],
    ['xl/styles.xml', stylesXml],
    ['xl/worksheets/sheet1.xml', sheetXml]
  ];
  const localParts=[], centralParts=[];
  let offset=0;
  zipFiles.forEach(([name,content])=>{
    const nameBytes=encoder.encode(name), data=encoder.encode(content), crc=crc32(data);
    const local=concat([
      u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),nameBytes,data
    ]);
    localParts.push(local);
    const central=concat([
      u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameBytes.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nameBytes
    ]);
    centralParts.push(central);
    offset += local.length;
  });
  const centralDir=concat(centralParts);
  const end=concat([
    u32(0x06054b50),u16(0),u16(0),u16(zipFiles.length),u16(zipFiles.length),u32(centralDir.length),u32(offset),u16(0)
  ]);
  const xlsxBytes=concat([...localParts, centralDir, end]);
  const blob=new Blob([xlsxBytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const date=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const filename=`工具管理_${date}.xlsx`;

  if(navigator.msSaveOrOpenBlob){
    navigator.msSaveOrOpenBlob(blob, filename);
  }else{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1200);
  }
  showToast('Excel 表格已下载');
}

function openToolCategoriesModal(){
  ensureToolData();
  const render = ()=>{
    const modal = document.querySelector('#modalRoot .modal');
    if(!modal) return;
    modal.classList.add('tool-management-modal');
    const body = modal.querySelector('.tool-category-modal-body');
    if(!body) return;
    body.innerHTML = `
      <div class="tool-modal-section">
        <div class="tool-modal-section-title">建立新分类</div>
        <div class="tool-category-create-row">
          <input type="text" id="newToolCategoryName" placeholder="输入分类名称">
          <button class="btn btn-primary" id="confirmToolCategory">建立</button>
        </div>
      </div>
      <div class="tool-modal-divider"></div>
      <div class="tool-modal-section">
        <div class="tool-modal-section-title">已建立分类</div>
        <div class="tool-category-list">
          ${state.toolCategories.length ? state.toolCategories.map(category=>`
            <div class="tool-category-manage-row">
              <div class="tool-category-manage-name">${escapeHtml(category.name)}</div>
              <div class="tool-category-manage-actions">
                <button class="tool-text-action" data-rename-tool-category="${category.id}">重命名</button>
                <button class="tool-text-action danger" data-delete-tool-category="${category.id}">删除</button>
              </div>
            </div>
          `).join('') : `<div class="tool-category-list-empty">还没有分类</div>`}
        </div>
      </div>
      <div class="modal-foot"><button class="btn" id="closeToolCategories">关闭</button></div>
    `;

    document.getElementById('closeToolCategories').onclick = closeModal;
    const input = document.getElementById('newToolCategoryName');
    const create = async ()=>{
      const name = input.value.trim();
      if(!name){ showToast('请输入分类名称'); return; }
      if(state.toolCategories.some(c=>c.name.toLowerCase()===name.toLowerCase())){
        showToast('这个分类已经存在'); return;
      }
      state.toolCategories.push({id:'tc_'+uid(), name, ts:Date.now()});
      await saveData();
      renderPage();
      render();
      showToast('分类已建立');
    };
    document.getElementById('confirmToolCategory').onclick = create;
    input.onkeydown = (e)=>{ if(e.key==='Enter') create(); };

    body.querySelectorAll('[data-rename-tool-category]').forEach(btn=>{
      btn.onclick = ()=>{
        const category = state.toolCategories.find(c=>c.id===btn.dataset.renameToolCategory);
        if(!category) return;
        openModal('重命名分类', `
          <div class="field"><label class="field-label">分类名称</label><input type="text" id="renameToolCategoryInput" value="${escapeHtml(category.name)}"></div>
          <div class="modal-foot">
            <button class="btn" id="cancelRenameToolCategory">取消</button>
            <button class="btn btn-primary" id="confirmRenameToolCategory">保存</button>
          </div>
        `, ()=>{
          const renameInput = document.getElementById('renameToolCategoryInput');
          document.getElementById('cancelRenameToolCategory').onclick = ()=>{ closeModal(); openToolCategoriesModal(); };
          document.getElementById('confirmRenameToolCategory').onclick = async ()=>{
            const name = renameInput.value.trim();
            if(!name){ showToast('请输入分类名称'); return; }
            if(state.toolCategories.some(c=>c.id!==category.id && c.name.toLowerCase()===name.toLowerCase())){
              showToast('这个分类已经存在'); return;
            }
            category.name = name;
            await saveData();
            closeModal();
            renderPage();
            openToolCategoriesModal();
            showToast('分类已更新');
          };
        });
      };
    });

    body.querySelectorAll('[data-delete-tool-category]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.dataset.deleteToolCategory;
        const category = state.toolCategories.find(c=>c.id===id);
        if(!category) return;
        if(state.tools.some(t=>t.categoryId===id)){
          showToast('这个分类里还有工具，请先移动或删除工具');
          return;
        }
        openModal('删除分类', `
          <div style="font-size:12.5px;color:var(--text-primary);line-height:1.65;">确定删除分类「${escapeHtml(category.name)}」吗？</div>
          <div class="modal-foot">
            <button class="btn" id="cancelDeleteToolCategory">取消</button>
            <button class="btn" id="confirmDeleteToolCategory" style="border-color:var(--danger);background:var(--danger);color:#fff;">删除</button>
          </div>
        `, ()=>{
          document.getElementById('cancelDeleteToolCategory').onclick = ()=>{ closeModal(); openToolCategoriesModal(); };
          document.getElementById('confirmDeleteToolCategory').onclick = async ()=>{
            state.toolCategories = state.toolCategories.filter(c=>c.id!==id);
            await saveData();
            closeModal();
            renderPage();
            openToolCategoriesModal();
            showToast('分类已删除');
          };
        });
      };
    });
  };

  openModal('工具分类', `<div class="tool-category-modal-body"></div>`, render);
}

function openToolEditorModal(toolId){
  ensureToolData();
  const tool = toolId ? state.tools.find(t=>t.id===toolId) : null;
  const isEdit = !!tool;
  let selectedCategoryId = tool?.categoryId && state.toolCategories.some(c=>c.id===tool.categoryId) ? tool.categoryId : '';
  let categoryExpanded = false;
  let newCategoryMode = false;
  let renameCategoryId = null;
  let categorySelectTimer = null;

  openModal(isEdit ? '编辑工具' : '添加工具', `
    <div class="tool-editor-form">
      <div class="field"><label class="field-label">工具名称</label><input type="text" id="toolEditorName" placeholder="输入工具名称" value="${tool?escapeHtml(tool.name):''}"></div>
      <div class="field"><label class="field-label">网页网址</label><input type="url" id="toolEditorUrl" placeholder="https://" value="${tool?escapeHtml(tool.url):''}"></div>
      <div class="field tool-editor-category-field tool-category-simple-field" id="toolEditorCategoryField">
        <label class="field-label">分类</label>
        <button type="button" class="tool-editor-category-toggle" id="toolEditorCategoryToggle" aria-expanded="false">
          <span id="toolEditorCategoryCurrent">未分类</span>
          <span class="category-toggle-caret">⌄</span>
        </button>
        <div class="tool-editor-category-list tool-category-simple-menu" id="toolEditorCategoryList"></div>
      </div>
      <div class="tool-editor-hint">单击选择分类；双击分类名称可改名；右侧可删除分类。</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelToolEditor">取消</button>
      <button class="btn btn-primary" id="confirmToolEditor">${isEdit?'保存':'确认添加'}</button>
    </div>
  `, ()=>{
    const modal = document.querySelector('#modalRoot .modal');
    if(modal) modal.classList.add('tool-editor-modal');

    const field = document.getElementById('toolEditorCategoryField');
    const categoryList = document.getElementById('toolEditorCategoryList');
    const categoryToggle = document.getElementById('toolEditorCategoryToggle');
    const categoryCurrent = document.getElementById('toolEditorCategoryCurrent');

    const currentCategoryName = ()=>{
      if(!selectedCategoryId) return '未分类';
      return state.toolCategories.find(c=>c.id===selectedCategoryId)?.name || '未分类';
    };

    const syncCategoryDisclosure = ()=>{
      categoryCurrent.textContent = currentCategoryName();
      categoryList.classList.toggle('open', categoryExpanded);
      categoryToggle.classList.toggle('open', categoryExpanded);
      categoryToggle.setAttribute('aria-expanded', categoryExpanded ? 'true' : 'false');
    };

    const closeCategoryMenu = ()=>{
      categoryExpanded = false;
      newCategoryMode = false;
      renameCategoryId = null;
      if(categorySelectTimer){ clearTimeout(categorySelectTimer); categorySelectTimer=null; }
      renderCategoryList();
    };

    categoryToggle.onclick = (e)=>{
      e.stopPropagation();
      categoryExpanded = !categoryExpanded;
      if(!categoryExpanded){ newCategoryMode=false; renameCategoryId=null; }
      renderCategoryList();
    };

    const saveCategoryRename = async(id, input)=>{
      const category = state.toolCategories.find(c=>c.id===id);
      if(!category) return;
      const name = input.value.trim();
      if(!name){ showToast('请输入分类名称'); input.focus(); return; }
      if(state.toolCategories.some(c=>c.id!==id && c.name.toLowerCase()===name.toLowerCase())){
        showToast('这个分类已经存在'); input.focus(); return;
      }
      if(name===category.name){ renameCategoryId=null; renderCategoryList(); return; }
      category.name = name;
      renameCategoryId = null;
      await saveData();
      renderCategoryList();
      renderPage();
      showToast('分类名称已更新');
    };

    const createInlineCategory = async(input)=>{
      const name = input.value.trim();
      if(!name){ showToast('请输入分类名称'); input.focus(); return; }
      const existed = state.toolCategories.find(c=>c.name.toLowerCase()===name.toLowerCase());
      if(existed){
        selectedCategoryId = existed.id;
        categoryExpanded = false;
        newCategoryMode = false;
        renderCategoryList();
        showToast('这个分类已经存在，已为你选中');
        return;
      }
      const category = {id:'tc_'+uid(), name, ts:Date.now()};
      state.toolCategories.push(category);
      selectedCategoryId = category.id;
      categoryExpanded = false;
      newCategoryMode = false;
      await saveData();
      renderCategoryList();
      renderPage();
      showToast('分类已建立并选中');
    };

    const renderCategoryList = ()=>{
      if(selectedCategoryId && !state.toolCategories.some(c=>c.id===selectedCategoryId)) selectedCategoryId = '';
      categoryCurrent.textContent = currentCategoryName();

      const categoryRows = state.toolCategories.map(category=>{
        if(renameCategoryId===category.id){
          return `
            <div class="tool-simple-category-row editing" data-editor-category-row="${category.id}">
              <input type="text" class="tool-editor-category-rename-input tool-simple-rename-input" data-simple-rename-input="${category.id}" value="${escapeHtml(category.name)}">
              <button type="button" class="tool-editor-category-delete" data-editor-category-delete="${category.id}">删除</button>
            </div>`;
        }
        return `
          <div class="tool-simple-category-row ${selectedCategoryId===category.id?'selected':''}" data-editor-category-row="${category.id}">
            <button type="button" class="tool-simple-category-name" data-editor-category-choice="${category.id}" data-editor-category-name="${category.id}" title="双击改名">${escapeHtml(category.name)}</button>
            <button type="button" class="tool-editor-category-delete" data-editor-category-delete="${category.id}">删除</button>
          </div>`;
      }).join('');

      categoryList.innerHTML = `
        <div class="tool-simple-category-row ${selectedCategoryId===''?'selected':''}">
          <button type="button" class="tool-simple-category-name" data-editor-category-choice="">未分类</button>
        </div>
        ${categoryRows}
        <div class="tool-simple-menu-divider"></div>
        ${newCategoryMode ? `
          <div class="tool-simple-category-create-row">
            <input type="text" id="toolSimpleNewCategoryInput" placeholder="输入分类名称">
            <button type="button" class="tool-simple-create-confirm" id="toolSimpleNewCategoryConfirm">建立</button>
          </div>` : `
          <button type="button" class="tool-editor-category-new tool-simple-category-new" id="toolEditorCategoryNew">新建分类…</button>`}
      `;

      categoryList.querySelectorAll('[data-editor-category-choice]').forEach(btn=>{
        btn.onclick = (e)=>{
          e.preventDefault();
          e.stopPropagation();
          const id = btn.dataset.editorCategoryChoice || '';
          if(btn.hasAttribute('data-editor-category-name')){
            if(categorySelectTimer) clearTimeout(categorySelectTimer);
            categorySelectTimer = setTimeout(()=>{
              selectedCategoryId = id;
              categoryExpanded = false;
              newCategoryMode = false;
              renameCategoryId = null;
              renderCategoryList();
              categorySelectTimer = null;
            }, 360);
          }else{
            selectedCategoryId = '';
            categoryExpanded = false;
            newCategoryMode = false;
            renameCategoryId = null;
            renderCategoryList();
          }
        };
      });

      categoryList.querySelectorAll('[data-editor-category-name]').forEach(btn=>{
        btn.ondblclick = (e)=>{
          e.preventDefault();
          e.stopPropagation();
          if(categorySelectTimer){ clearTimeout(categorySelectTimer); categorySelectTimer=null; }
          renameCategoryId = btn.dataset.editorCategoryName;
          newCategoryMode = false;
          renderCategoryList();
          const input = categoryList.querySelector(`[data-simple-rename-input="${renameCategoryId}"]`);
          if(input){ setTimeout(()=>{ input.focus(); input.select(); },0); }
        };
      });

      categoryList.querySelectorAll('[data-simple-rename-input]').forEach(input=>{
        const id = input.dataset.simpleRenameInput;
        input.onclick = e=>e.stopPropagation();
        input.ondblclick = e=>e.stopPropagation();
        input.onkeydown = (e)=>{
          if(e.key==='Enter'){ e.preventDefault(); saveCategoryRename(id,input); }
          if(e.key==='Escape'){ e.preventDefault(); renameCategoryId=null; renderCategoryList(); }
        };
        input.onblur = ()=>{
          // 延迟一帧，避免点“删除”等操作时先触发保存。
          setTimeout(()=>{
            if(document.body.contains(input) && renameCategoryId===id) saveCategoryRename(id,input);
          },0);
        };
      });

      categoryList.querySelectorAll('[data-editor-category-delete]').forEach(btn=>{
        btn.onclick = (e)=>{
          e.preventDefault();
          e.stopPropagation();
          if(categorySelectTimer){ clearTimeout(categorySelectTimer); categorySelectTimer=null; }
          const id = btn.dataset.editorCategoryDelete;
          const category = state.toolCategories.find(c=>c.id===id);
          if(!category) return;
          const usedCount = state.tools.filter(t=>t.categoryId===id).length;
          const message = usedCount
            ? `确定删除分类「${category.name}」吗？该分类下的 ${usedCount} 个工具会移动到「未分类」，工具本身不会删除。`
            : `确定删除分类「${category.name}」吗？`;
          confirmAction(message, async ()=>{
            state.tools.forEach(t=>{ if(t.categoryId===id) t.categoryId=''; });
            state.toolCategories = state.toolCategories.filter(c=>c.id!==id);
            if(selectedCategoryId===id) selectedCategoryId='';
            renameCategoryId=null;
            await saveData();
            renderCategoryList();
            renderPage();
            showToast(usedCount ? '分类已删除，工具已移至未分类' : '分类已删除');
          });
        };
      });

      const newBtn = document.getElementById('toolEditorCategoryNew');
      if(newBtn){
        newBtn.onclick = (e)=>{
          e.preventDefault(); e.stopPropagation();
          newCategoryMode = true;
          renameCategoryId = null;
          renderCategoryList();
          const input=document.getElementById('toolSimpleNewCategoryInput');
          if(input) setTimeout(()=>input.focus(),0);
        };
      }

      const newInput=document.getElementById('toolSimpleNewCategoryInput');
      const newConfirm=document.getElementById('toolSimpleNewCategoryConfirm');
      if(newInput){
        newInput.onclick=e=>e.stopPropagation();
        newInput.onkeydown=e=>{
          if(e.key==='Enter'){ e.preventDefault(); createInlineCategory(newInput); }
          if(e.key==='Escape'){ e.preventDefault(); newCategoryMode=false; renderCategoryList(); }
        };
      }
      if(newConfirm){
        newConfirm.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); createInlineCategory(newInput); };
      }

      syncCategoryDisclosure();
    };

    if(modal){
      modal.addEventListener('click',(e)=>{
        if(categoryExpanded && !field.contains(e.target)) closeCategoryMenu();
      });
    }

    renderCategoryList();

    document.getElementById('cancelToolEditor').onclick = closeModal;
    document.getElementById('confirmToolEditor').onclick = async ()=>{
      const name = document.getElementById('toolEditorName').value.trim();
      let url = document.getElementById('toolEditorUrl').value.trim();
      const categoryId = selectedCategoryId || null;
      if(!name || !url){ showToast('请填写工具名称和网页网址'); return; }
      if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
      try{ new URL(url); }catch(e){ showToast('请输入有效的网址'); return; }
      const duplicate = state.tools.find(t=>t.id!==toolId && t.url.replace(/\/$/,'').toLowerCase()===url.replace(/\/$/,'').toLowerCase());
      if(duplicate){ showToast(`这个网址已经添加为「${duplicate.name}」`); return; }
      if(isEdit){
        tool.name = name;
        tool.url = url;
        tool.categoryId = categoryId;
      }else{
        state.tools.push({id:'t_'+uid(), name, url, categoryId});
      }
      await saveData();
      closeModal();
      renderPage();
      showToast(isEdit ? '工具已更新' : '工具已添加');
    };
  });
}

function announcementAuthorHtml(n){
  const person = n.authorId ? getPersonnel(n.authorId) : null;
  const name = person?.name || n.authorName || (n.authorId ? String(n.authorId) : '历史公告');
  const avatar = person?.avatar || n.authorAvatar || '';
  const bg = avatar ? 'rgba(225,222,216,.72)' : colorFor(name);
  const content = avatar
    ? `<img src="${escapeHtml(avatar)}" alt="${escapeHtml(name)}">`
    : initials(name);
  return `
    <div class="announcement-author-meta">
      <div class="announcement-author-avatar" style="background:${bg}">${content}</div>
      <div class="announcement-author-text">
        <div class="announcement-author-name">${escapeHtml(name)}</div>
        <div class="announcement-time">${fmtAnnouncementTimeGlobal(n.ts)}</div>
      </div>
    </div>`;
}
function fmtAnnouncementTimeGlobal(ts){
  const d = new Date(ts);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function pageNotify(){
  const announcements = state.notifications
    .filter(n=>n.type==='manual')

    .sort((a,b)=>b.ts-a.ts);
  return `
    <div class="notify-wrap">

        <div class="notify-box">
          <textarea id="notifyInput" placeholder="输入公告内容…"></textarea>
        </div>

          <button class="btn btn-primary" id="btnSendNotify">发布公告</button>
        </div>
      </div>
      <div class="announcement-feed">
        <div class="announcement-feed-title">公告内容</div>
        <div class="announcement-scroll">
          ${announcements.length ? announcements.map(n=>`
            <div class="announcement-item" data-announcement-id="${n.id}">
              ${announcementAuthorHtml(n)}
              <div class="announcement-content">${escapeHtml(n.content)}</div>
              <div class="announcement-actions">
                <button type="button" class="announcement-action" data-edit-announcement="${n.id}">编辑</button>
                <button type="button" class="announcement-action clear" data-clear-announcement="${n.id}">清除</button>

          `).join('') : `<div class="announcement-feed-empty">暂无已发布公告</div>`}

}

function openProjectMembersModal(pid){
  const proj = state.projects.find(p=>p.id===pid);
  if(!proj) return;
  const addedPersonnelIds = new Set(proj.members.map(m=>m.personnelId).filter(Boolean));
  const available = state.personnel.filter(p=>!addedPersonnelIds.has(p.id));

  openModal(`${escapeHtml(proj.name)} · 项目人员`, `

      <div class="project-members-add-section">

              <select id="modalNewMemberPerson_${pid}">

        </div>
      </div>

      <div class="project-members-divider"></div>

      <div>
        <div class="project-members-section-title">已添加人员</div>
        <div class="project-member-list">
          ${proj.members.length ? proj.members.map(m=>`
            <div class="project-member-manage-row">
              ${avatarHtml(m.personnelId, m.name,'sm')}
              <div class="member-info">
                <span class="member-name">${escapeHtml(m.name)}</span>
                <span class="member-role">${escapeHtml((m.personnelId ? getPersonnel(m.personnelId)?.position : '') || m.role || '')}</span>

      btn.onclick = async ()=>{
        const [pId,mId] = btn.dataset.modalRemoveMember.split('|');
        const p = state.projects.find(p=>p.id===pId);
        if(!p) return;
        p.members = p.members.filter(m=>m.id!==mId);
        await saveData();
        renderPage();
        closeModal();
        openProjectMembersModal(pId);
        showToast('已移除人员');
      };
    });

    const addBtn = document.getElementById('projectMembersAdd');
    if(addBtn && available.length){
      addBtn.onclick = async ()=>{
        const personSel = document.getElementById('modalNewMemberPerson_'+pid);
        const personnelId = personSel && personSel.value;
        const person = getPersonnel(personnelId);
        if(!person){ showToast('请选择成员'); return; }
        const currentProj = state.projects.find(p=>p.id===pid);
        if(!currentProj) return;
        if(currentProj.members.some(m=>m.personnelId===personnelId)){
          showToast('该成员已在项目中'); return;
        }
        let role = (document.getElementById('modalNewMemberRole_'+pid)?.value || '').trim();
        if(!role) role = person.position;
        currentProj.members.push({id:'m_'+uid(), personnelId, name:person.name, role, goals:[]});
        await saveData();
        renderPage();
        closeModal();
        openProjectMembersModal(pid);
        showToast('已添加人员');
      };
    }
  });
}

/* ============ 弹窗表单 ============ */
function openModal(title, bodyHtml, onMount){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-mask open" id="modalMask">
      <div class="modal">
        <div class="modal-title">${title}</div>
        ${bodyHtml}
      </div>
    </div>
  `;
  document.getElementById('modalMask').addEventListener('click', (e)=>{
    if(e.target.id==='modalMask') closeModal();
  });
  if(onMount) onMount();
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

// 沙箱环境里 window.confirm 可能被浏览器拦截导致按钮"点不动"，改用自带的确认弹窗
function confirmActionOverCurrent(message, onConfirm){
  const root = document.getElementById('modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-mask open confirm-overlay';
  overlay.style.zIndex = '220';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">确认操作</div>
      <div style="font-size:12.5px; color:var(--text-primary); line-height:1.65; margin-bottom:2px;">${escapeHtml(message)}</div>
      <div class="modal-foot">
        <button class="btn" data-confirm-cancel>取消</button>
        <button class="btn" data-confirm-ok style="border-color:var(--danger); background:var(--danger); color:#fff;">确定</button>
      </div>
    </div>
  `;
  root.appendChild(overlay);
  const closeOverlay = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeOverlay(); });
  overlay.querySelector('[data-confirm-cancel]').onclick = closeOverlay;
  overlay.querySelector('[data-confirm-ok]').onclick = async ()=>{
    closeOverlay();
    await onConfirm();
  };
}

function confirmAction(message, onConfirm){
  openModal('确认操作', `
    <div style="font-size:12.5px; color:var(--text-primary); line-height:1.65; margin-bottom:2px;">${escapeHtml(message)}</div>
    <div class="modal-foot">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn" id="confirmOk" style="border-color:var(--danger); background:var(--danger); color:#fff;">确定</button>
    </div>
  `, ()=>{
    document.getElementById('confirmCancel').onclick = closeModal;
    document.getElementById('confirmOk').onclick = async ()=>{
      closeModal();
      await onConfirm();
    };
  });
}

      <div class="field"><label class="field-label">预计结束日期</label><input type="date" id="a_project_end" value="${addDays(30)}"></div>
