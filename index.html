<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作室管理</title>
<style>
  :root{
    --sidebar-bg:#FBFBFD;
    --sidebar-text:#6E6E73;
    --sidebar-text-active:#1D1D1F;
    --sidebar-line: rgba(0,0,0,0.06);
    --sidebar-active-bg: rgba(0,113,227,0.1);
    --accent:#0071E3;
    --accent-dark:#0058B0;
    --accent-soft: rgba(0,113,227,0.08);
    --main-bg:#F5F5F7;
    --card-bg:#FFFFFF;
    --border: rgba(0,0,0,0.08);
    --border-soft: rgba(0,0,0,0.05);
    --text-primary:#1D1D1F;
    --text-secondary:#6E6E73;
    --text-tertiary:#A1A1A6;
    --radius:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.05);
    --status-todo-bg:#F0F0F2; --status-todo-text:#6E6E73;
    --status-doing-bg:#E8F1FE; --status-doing-text:#0071E3;
    --status-soon-bg:#FFF4E5; --status-soon-text:#C1740A;
    --status-done-bg:#E7F8EC; --status-done-text:#248A3D;
    --danger:#E0362B;
    --danger-soft: rgba(224,54,43,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    color:var(--text-primary);
    background:var(--main-bg);
    -webkit-font-smoothing:antialiased;
    letter-spacing:0.1px;
  }
  #app{display:flex; height:100vh; overflow:hidden;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:206px; flex-shrink:0; background:var(--sidebar-bg);
    display:flex; flex-direction:column; height:100%;
    padding:22px 0 18px; border-right:1px solid var(--sidebar-line);
  }
  .sidebar-brand{padding:0 22px 22px; border-bottom:1px solid var(--sidebar-line); margin-bottom:10px;}
  .sidebar-brand .name{color:var(--sidebar-text-active); font-size:14.5px; font-weight:600; letter-spacing:0.1px;}
  .sidebar-brand .sub{color:var(--text-tertiary); font-size:11px; margin-top:4px;}
  .nav{flex:1; display:flex; flex-direction:column; gap:2px; padding:6px 10px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; border-radius:8px; cursor:pointer;
    color:var(--sidebar-text); font-size:13px; font-weight:400;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item:hover{background:rgba(0,0,0,0.035); color:var(--sidebar-text-active);}
  .nav-item.active{background:var(--sidebar-active-bg); color:var(--accent); font-weight:600;}
  .nav-item .ic{width:15px; text-align:center; font-size:13px; opacity:0.9;}
  .sidebar-foot{padding:14px 22px 0; border-top:1px solid var(--sidebar-line); margin-top:10px;}
  .sidebar-foot .id-line{color:var(--text-tertiary); font-size:10.5px;}

  /* ---------- Main ---------- */
  .main{flex:1; overflow-y:auto; height:100%;}
  .page{padding:34px 42px 60px; max-width:1080px;}
  .page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px;}
  .page-title{font-size:16px; font-weight:600; color:var(--text-primary); letter-spacing:0.1px;}
  .page-desc{font-size:12px; color:var(--text-secondary); margin-top:4px;}

  .btn{
    font-size:12px; padding:7px 15px; border-radius:980px; border:1px solid transparent;
    background:#F0F0F2; color:var(--text-primary); cursor:pointer; white-space:nowrap;
    transition:all .15s ease;
  }
  .btn:hover{background:#E5E5E7;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn:disabled:hover{background:#F0F0F2;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark); color:#fff;}
  .btn-text{border:none; background:none; color:var(--text-secondary); padding:4px 6px; border-radius:0;}
  .btn-text:hover{color:var(--accent); background:none;}
  .btn-danger{color:var(--danger); background:transparent;}
  .btn-danger:hover{color:#fff; background:var(--danger);}
  .btn-sm{padding:5px 12px; font-size:11.5px;}

  input[type=text], input[type=date], input[type=url], textarea, select{
    font-family:inherit; font-size:12.5px; color:var(--text-primary);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px;
    background:#fff; outline:none; width:100%; transition:border-color .12s ease, box-shadow .12s ease;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  textarea{resize:vertical; min-height:56px; line-height:1.55;}
  label.field-label{display:block; font-size:11.5px; color:var(--text-secondary); margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .card{background:var(--card-bg); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-card);}
  .hairline{border-top:1px solid var(--border-soft);}

  .chip{display:inline-flex; align-items:center; font-size:11px; padding:2.5px 9px; border-radius:20px; font-weight:500;}
  .chip-todo{background:var(--status-todo-bg); color:var(--status-todo-text);}
  .chip-doing{background:var(--status-doing-bg); color:var(--status-doing-text);}
  .chip-soon{background:var(--status-soon-bg); color:var(--status-soon-text);}
  .chip-done{background:var(--status-done-bg); color:var(--status-done-text);}
  .chip-overdue{background:var(--danger-soft); color:var(--danger);}

  select.status-select{
    font-size:11px; padding:3px 8px; border-radius:20px; border:1px solid var(--border);
    background:#fff; color:var(--text-secondary); cursor:pointer; width:auto;
  }

  .avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; font-weight:600;
  }
  .avatar.sm{width:24px; height:24px; font-size:10.5px;}

  /* ---------- Dashboard ---------- */
  .dash-top{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px;}
  .dash-date .big{font-size:20px; font-weight:600; color:var(--text-primary); letter-spacing:0.1px;}
  .dash-date .small{font-size:12px; color:var(--text-secondary); margin-top:3px;}

  .carousel{
    position:relative; background:var(--text-primary); color:#F5F5F7; border-radius:var(--radius);
    padding:11px 18px; margin-bottom:26px; display:flex; align-items:center; gap:10px;
    overflow:hidden; font-size:12.5px; box-shadow:var(--shadow-card);
  }
  .carousel .dot-label{font-size:10.5px; color:#9A9DA3; flex-shrink:0; letter-spacing:0.5px;}
  .carousel .msg{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .carousel .dots{display:flex; gap:4px; flex-shrink:0;}
  .carousel .dots span{width:4px; height:4px; border-radius:50%; background:#55565B; display:block;}
  .carousel .dots span.on{background:#4DA3FF;}

  .section{margin-bottom:32px;}
  .section-title{font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
  .section-title .count{font-size:11px; color:var(--text-tertiary); font-weight:400;}

  .goal-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:10px;}
  .goal-card{background:var(--card-bg); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow-card);}
  .goal-card .who{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .goal-card .who .meta .nm{font-size:12.5px; font-weight:600; color:var(--text-primary);}
  .goal-card .who .meta .rl{font-size:11px; color:var(--text-secondary); margin-top:1px;}
  .goal-card .proj-tag{margin-left:auto; font-size:10.5px; color:var(--text-tertiary); background:var(--main-bg); padding:2px 8px; border-radius:20px;}
  .goal-card .content{font-size:12.5px; color:var(--text-primary); line-height:1.5; font-weight:500;}
  .goal-card .goal-item-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:9px;}
  .goal-card .goal-item-top .chip{flex-shrink:0; margin-top:1px;}
  .goal-card .bottom{display:flex; align-items:center; justify-content:flex-end;}
  .goal-card .ddl{font-size:11px; color:var(--text-tertiary);}
  .goal-card .goal-item{padding-top:11px; border-top:1px solid var(--border-soft);}
  .goal-card .goal-item:first-of-type{padding-top:0; border-top:none;}

  .empty{color:var(--text-tertiary); font-size:12px; padding:20px 0;}

  .tool-strip{display:flex; flex-wrap:wrap; gap:9px;}
  .tool-chip{
    display:flex; align-items:center; gap:7px; padding:9px 14px; background:var(--card-bg);
    border:1px solid var(--border-soft); border-radius:var(--radius-sm); cursor:pointer; font-size:12px; color:var(--text-primary);
    text-decoration:none; transition:all .15s ease; box-shadow:var(--shadow-card);
  }
  .tool-chip:hover{color:var(--accent); background:var(--accent-soft); box-shadow:none;}
  .tool-chip .dotico{width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0;}

  /* ---------- Projects ---------- */
  .proj-card{background:var(--card-bg); border:1px solid var(--border-soft); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow-card);}
  .proj-head{display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer;}
  .proj-head .caret{font-size:13px; color:var(--text-secondary); width:14px; transition:transform .15s ease;}
  .proj-head.open .caret{transform:rotate(90deg);}
  .proj-head .pname{font-size:13.5px; font-weight:600; color:var(--text-primary);}
  .proj-head .pname.done{color:var(--text-tertiary); text-decoration:line-through;}
  .proj-head .pmeta{font-size:11px; color:var(--text-tertiary); margin-left:2px;}
  .proj-head .spacer{flex:1;}
  .proj-body{padding:0 18px 18px; display:none;}
  .proj-body.open{display:block;}
  .member-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:12px; padding-top:14px;}
  .member-block{background:var(--main-bg); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:13px 14px; display:flex; flex-direction:column;}
  .member-row{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .member-row .nm{font-size:12.5px; font-weight:600;}
  .member-row .rl{font-size:11px; color:var(--text-secondary);}
  .member-row .spacer{flex:1;}
  .goal-list{display:flex; flex-direction:column; gap:6px;}
  .goal-row{display:flex; flex-direction:column; gap:5px; font-size:11.5px; padding:9px 10px; background:var(--card-bg); border:1px solid var(--border-soft); border-radius:8px;}
  .goal-row.muted{background:var(--main-bg); opacity:0.75;}
  .goal-row.muted .gc{text-decoration:line-through; color:var(--text-secondary);}
  .goal-row .gc{color:var(--text-primary); line-height:1.5; font-weight:500; white-space:normal; word-break:break-word;}
  .goal-row .goal-meta{display:flex; align-items:center; gap:7px;}
  .goal-row .goal-meta .spacer{flex:1;}
  .goal-row .gd{color:var(--text-tertiary); font-size:10px; flex-shrink:0; white-space:nowrap;}
  .goal-row select.status-select{flex-shrink:0; font-weight:500; border-color:transparent;}
  .goal-row .del{
    color:var(--text-tertiary); cursor:pointer; font-size:10.5px; flex-shrink:0;
    width:18px; height:18px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; transition:background .12s ease, color .12s ease;
  }
  .goal-row .del:hover{color:#fff; background:var(--danger);}
  .done-goals-toggle{margin-top:8px; font-size:11px; color:var(--text-tertiary); cursor:pointer; display:flex; align-items:center; gap:4px;}
  .done-goals-toggle:hover{color:var(--text-secondary);}
  .done-goals-toggle .arrow{font-size:9px; transition:transform .15s ease;}
  .done-goals-toggle.open .arrow{transform:rotate(90deg);}
  .done-goals-list{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
  .inline-add{margin-top:8px;}
  .goal-list-foot{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .done-icon-btn{
    position:relative; width:24px; height:24px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--card-bg); border:1px solid var(--border-soft); color:var(--text-tertiary);
    transition:all .12s ease;
  }
  .done-icon-btn svg{width:12px; height:12px;}
  .done-icon-btn:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-soft);}
  .done-icon-btn.open{color:var(--accent); border-color:var(--accent); background:var(--accent-soft);}
  .done-badge{
    position:absolute; top:-4px; right:-5px; min-width:14px; height:14px; padding:0 3px; border-radius:8px;
    background:var(--status-done-text); color:#fff; font-size:9px; font-weight:600; line-height:14px; text-align:center;
  }
  .add-member-row{margin-top:14px;}
  .inline-form{background:var(--main-bg); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:12px; margin-top:8px;}
  .inline-form-title{font-size:11.5px; color:var(--text-secondary); margin-bottom:8px;}

  .panel-toggle{
    display:flex; align-items:center; gap:6px; padding:6px 0; font-size:12px; color:var(--accent); cursor:pointer;
  }
  .archived-section-title{font-size:12px; font-weight:600; color:var(--text-tertiary); margin:28px 0 12px; padding-top:20px; border-top:1px solid var(--border-soft); display:flex; align-items:center; gap:8px;}
  .archived-section-title .count{font-weight:400;}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:11px; color:var(--text-tertiary); font-weight:500; padding:0 10px 10px; border-bottom:1px solid var(--border);}
  td{padding:11px 10px; border-bottom:1px solid var(--border-soft); font-size:12.5px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover{background:rgba(0,0,0,0.018);}
  .row-flex{display:flex; align-items:center; gap:9px;}
  .mono-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--text-tertiary);}

  /* ---------- Collab ---------- */
  .collab-card{background:var(--card-bg); border:1px solid var(--border-soft); border-radius:var(--radius); padding:15px 18px; margin-bottom:10px; box-shadow:var(--shadow-card);}
  .collab-head{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .collab-head .ttl{font-size:12.5px; font-weight:600; flex:1;}
  .collab-head .status-badge{font-size:11px; padding:2.5px 10px; border-radius:20px;}
  .sb-pending{background:var(--status-soon-bg); color:var(--status-soon-text);}
  .sb-approved{background:var(--status-done-bg); color:var(--status-done-text);}
  .sb-rejected{background:var(--danger-soft); color:var(--danger);}
  .collab-body{margin-top:12px; display:none;}
  .collab-body.open{display:block;}
  .collab-field{margin-bottom:10px;}
  .collab-field .k{font-size:11px; color:var(--text-tertiary); margin-bottom:3px;}
  .collab-field .v{font-size:12.5px; color:var(--text-primary); line-height:1.6;}
  .collab-foot{display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--border-soft);}

  /* ---------- Notify page ---------- */
  .notify-wrap{max-width:640px; position:relative;}
  .notify-box textarea{min-height:150px; font-size:13px; line-height:1.7;}
  .notify-actions{display:flex; justify-content:flex-end; margin-top:10px;}
  .bell{
    position:fixed; top:20px; right:26px; font-size:10.5px; color:var(--text-tertiary);
    cursor:pointer; padding:4px 8px; border-radius:20px; display:flex; align-items:center; gap:4px;
  }
  .bell:hover{color:var(--accent);}
  .bell .n{width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .bell-drop{
    position:fixed; top:42px; right:26px; width:230px; max-height:280px; overflow-y:auto;
    background:#fff; border:1px solid var(--border-soft); border-radius:var(--radius-sm); box-shadow:var(--shadow-card);
    padding:8px; display:none; z-index:50;
  }
  .bell-drop.open{display:block;}
  .bell-item{padding:7px 8px; border-bottom:1px solid var(--border-soft); font-size:11px; color:var(--text-secondary); line-height:1.5;}
  .bell-item:last-child{border-bottom:none;}
  .bell-item .t{color:var(--text-tertiary); font-size:10px; margin-top:2px;}

  .modal-mask{position:fixed; inset:0; background:rgba(231,233,236,0.42); backdrop-filter:none; -webkit-backdrop-filter:none; display:none; align-items:center; justify-content:center; z-index:100;}
  .modal-mask.open{display:flex;}
  .modal{background:#fff; border-radius:18px; width:460px; max-width:92vw; max-height:86vh; overflow-y:auto; padding:24px 26px; box-shadow:0 20px 60px rgba(0,0,0,0.18);}
  .modal-title{font-size:14.5px; font-weight:600; margin-bottom:16px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--text-primary); color:#F5F5F7; font-size:12px; padding:10px 20px; border-radius:980px;
    opacity:0; pointer-events:none; transition:all .2s ease; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,0.18);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- 群公告悬浮对话框 ---------- */
  .announce-fab{
    position:fixed; right:26px; bottom:26px; width:44px; height:44px; border-radius:50%;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 4px 16px rgba(0,113,227,0.3); z-index:70; transition:transform .12s ease;
  }
  .announce-fab:hover{transform:translateY(-1px); background:var(--accent-dark);}
  .announce-dot{
    position:absolute; top:1px; right:1px; width:9px; height:9px; border-radius:50%;
    background:var(--danger); border:2px solid var(--main-bg);
  }
  .announce-panel{
    position:fixed; right:26px; bottom:82px; width:288px; max-height:360px;
    background:#fff; border:1px solid var(--border-soft); border-radius:18px;
    box-shadow:0 16px 44px rgba(0,0,0,0.16); z-index:70;
    display:flex; flex-direction:column; overflow:hidden;
    opacity:0; transform:translateY(8px) scale(0.98); pointer-events:none;
    transform-origin:bottom right; transition:opacity .16s ease, transform .16s ease;
  }
  .announce-panel.open{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .announce-panel::after{
    content:''; position:absolute; bottom:-7px; right:18px; width:12px; height:12px;
    background:#fff; border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);
    transform:rotate(45deg);
  }
  .announce-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--border-soft); font-size:12.5px; font-weight:600;
    flex-shrink:0;
  }
  .announce-close{cursor:pointer; color:var(--text-tertiary); font-size:15px; line-height:1;}
  .announce-close:hover{color:var(--text-primary);}
  .announce-list{overflow-y:auto; padding:4px 8px;}
  .announce-item{padding:10px 8px; border-bottom:1px solid var(--border-soft); position:relative;}
  .announce-item:last-child{border-bottom:none;}
  .announce-item.unread{background:var(--accent-soft); border-radius:10px; border-bottom-color:transparent;}
  .announce-dot-mark{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--danger); margin-right:7px; vertical-align:middle; flex-shrink:0;}
  .announce-content{font-size:12px; color:var(--text-primary); line-height:1.6; display:flex; align-items:flex-start;}
  .announce-time{font-size:10px; color:var(--text-tertiary); margin-top:4px;}
  .announce-item.unread .announce-time{padding-left:12px;}
  .announce-empty{padding:20px 10px; text-align:center; font-size:11.5px; color:var(--text-tertiary);}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#D2D2D7; border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

/* ===== 人员管理：只读状态 + 管理员统一编辑 ===== */
.person-status-static{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:400;white-space:nowrap;border:1px solid rgba(255,255,255,.66);box-shadow:3px 3px 8px rgba(167,160,151,.14),-3px -3px 8px rgba(255,255,255,.55);}
.person-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;white-space:nowrap;}
.person-edit-btn{color:var(--text-secondary);}
.person-edit-btn:hover{color:var(--text-primary);}

<style id="visual-upgrade-minimal-tech">
  /* ===== Visual Upgrade: Futuristic Neumorphism / Spacious ===== */

    --radius:28px;

    --shadow-card:var(--neo-shadow-raised-sm);
    --status-todo-bg:#E1E4E6; --status-todo-text:#74797D;
    --status-doing-bg:#DDE8E4; --status-doing-text:#4F776A;
    --status-soon-bg:#EEE1D4; --status-soon-text:#A36D37;
    --status-done-bg:#DDE8E0; --status-done-text:#5B7962;
    --danger:#A85C57;
    --danger-soft:#EADBD9;
  }

  *{scrollbar-color:#C9CCCE transparent;}
  html,body{background:var(--neo-bg);}

/* ============ 工具函数 ============ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const PALETTE = ['#5B7291','#8A7B6B','#6E8B72','#8C6E8A','#7A7D5B','#6E7E8C'];
function colorFor(name){
  let h = 0; for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
  return PALETTE[Math.abs(h) % PALETTE.length];
}
function initials(name){ return (name||'?').trim().slice(0,1); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function fmtCompletionTime(ts){
  if(!ts) return '历史完成时间未记录';
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '历史完成时间未记录';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function completionTiming(goal){
  if(!goal || !goal.completedAt || !goal.deadline) return {text:'完成进度未记录', cls:'ontime'};
  const done = new Date(goal.completedAt);
  if(Number.isNaN(done.getTime())) return {text:'完成进度未记录', cls:'ontime'};
  const doneDay = new Date(done.getFullYear(), done.getMonth(), done.getDate());
  const deadline = new Date(goal.deadline+'T00:00:00');
  const diff = Math.round((deadline - doneDay) / 86400000);
  if(diff > 0) return {text:`提前 ${diff} 天完成`, cls:'early'};
  if(diff < 0) return {text:`延迟 ${Math.abs(diff)} 天完成`, cls:'late'};
  return {text:'按期完成', cls:'ontime'};
}
const STATUS_COLORS = {
  '待开始': {bg:'var(--status-todo-bg)', fg:'var(--status-todo-text)'},
  '推进中': {bg:'var(--status-doing-bg)', fg:'var(--status-doing-text)'},

};
const PRIORITY_LEVELS = ['一般','重要','紧急','重要且紧急'];
const PRIORITY_COLORS = {
  '一般': {bg:'rgba(110,110,115,.08)', fg:'var(--text-secondary)'},
  '重要': {bg:'rgba(89,111,156,.10)', fg:'#667A9C'},
  '紧急': {bg:'rgba(193,116,10,.10)', fg:'#B2762C'},
  '重要且紧急': {bg:'rgba(180,76,70,.10)', fg:'#A85C56'},
};
const PRIORITY_RANK = {'一般':1,'重要':2,'紧急':3,'重要且紧急':4};

}
function daysUntil(iso){
  const d = new Date(iso+'T00:00:00');
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function remainingLabel(iso){
  const days = daysUntil(iso);
  if(days < 0) return {text:`已超期${Math.abs(days)}天`, cls:'chip-overdue'};
  if(days === 0) return {text:'今天截止', cls:'chip-soon'};
  if(days <= 13) return {text:`还剩${days}天`, cls:'chip-doing'};
  if(days <= 60) return {text:`还剩${Math.round(days/7)}周`, cls:'chip-doing'};
  return {text:`还剩${Math.round(days/30)}个月`, cls:'chip-todo'};
}
function strategicGoalTimeVisual(goal){
  const now = Date.now();
  const end = new Date((goal?.deadline || todayISO()) + 'T23:59:59').getTime();
  let start = Number(goal?.createdAt);
  if(!Number.isFinite(start)) start = now;
  if(!Number.isFinite(end)) return {pct:0, short:'', full:''};
  if(start >= end) start = end - 86400000;
  const total = Math.max(86400000, end - start);
  const pct = Math.max(0, Math.min(100, Math.round(((now - start) / total) * 100)));
  const rem = remainingLabel(goal.deadline);
  let short = rem.text;
  if(short.startsWith('还剩')) short = short.slice(2);
  else if(short.startsWith('已超期')) short = '超' + short.slice(3);
  else if(short === '今天截止') short = '今天';
  return {pct, short, full:rem.text};
}

function statusFromProgress(progress){
  const p = Math.max(0, Math.min(100, Number(progress)||0));
  if(p >= 100) return '已完成';
  if(p >= 80) return '即将完成';
  if(p > 0) return '推进中';

}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function studioClone(v){return v===undefined?v:JSON.parse(JSON.stringify(v));}
function studioSame(a,b){try{return JSON.stringify(a)===JSON.stringify(b);}catch(e){return false;}}
function studioIsObj(v){return v!==null&&typeof v==='object'&&!Array.isArray(v);}
function studioIdentifiableArray(arr){return Array.isArray(arr)&&(arr.length===0||arr.every(x=>studioIsObj(x)&&x.id!==undefined&&x.id!==null&&String(x.id)!==''));}
function studioMergeThreeWay(latest,base,next){
  if(studioSame(base,next)) return studioClone(latest);
  if(Array.isArray(base)&&Array.isArray(next)){
    if(Array.isArray(latest)&&studioIdentifiableArray(base)&&studioIdentifiableArray(next)&&studioIdentifiableArray(latest)){
      const b=new Map(base.map(x=>[String(x.id),x]));
      const n=new Map(next.map(x=>[String(x.id),x]));
      const l=new Map(latest.map(x=>[String(x.id),x]));
      for(const id of b.keys()) if(!n.has(id)) l.delete(id);
      for(const [id,nv] of n){
        if(!b.has(id)){l.set(id,studioClone(nv));continue;}
        const bv=b.get(id),lv=l.has(id)?l.get(id):bv;
        if(!studioSame(bv,nv)) l.set(id,studioMergeThreeWay(lv,bv,nv));
      }
      const order=[];
      for(const x of latest){const id=String(x.id);if(l.has(id)&&!order.includes(id))order.push(id);}
      for(const x of next){const id=String(x.id);if(l.has(id)&&!order.includes(id))order.push(id);}
      return order.map(id=>l.get(id));
    }
    return studioClone(next);
  }
  if(studioIsObj(base)&&studioIsObj(next)){
    const out=studioIsObj(latest)?studioClone(latest):{};
    const keys=new Set([...Object.keys(base),...Object.keys(next)]);
    for(const k of keys){
      const hasB=Object.prototype.hasOwnProperty.call(base,k),hasN=Object.prototype.hasOwnProperty.call(next,k);
      if(hasB&&!hasN){delete out[k];continue;}
      if(!hasB&&hasN){out[k]=studioClone(next[k]);continue;}
      if(studioSame(base[k],next[k]))continue;
      out[k]=studioMergeThreeWay(studioIsObj(out)||Array.isArray(out)?out[k]:undefined,base[k],next[k]);
    }
    return out;
  }
  return studioClone(next);
}

  if(studioSaveInFlight||!studioPendingSave)return;

let studioLiveSyncTimer=null,studioLiveSyncBusy=false;
function stopWorkspaceLiveSync(){if(studioLiveSyncTimer){clearInterval(studioLiveSyncTimer);studioLiveSyncTimer=null;}}
function studioEditingNow(){const ae=document.activeElement;const tag=(ae?.tagName||'').toLowerCase();return tag==='input'||tag==='textarea'||tag==='select'||ae?.isContentEditable;}
async function studioPullRemoteIfChanged(){
  if(studioLiveSyncBusy||!currentWorkspaceId||!studioAuthSession?.access_token||studioPendingSave||studioSaveInFlight||studioEditingNow())return;
  studioLiveSyncBusy=true;
  try{
    const head=await studioWorkspaceCloud('head',{workspaceId:currentWorkspaceId});
    if(!head?.updatedAt||head.updatedAt===studioBaselineUpdatedAt)return;
    const remote=await studioWorkspaceCloud('load',{workspaceId:currentWorkspaceId});
    if(!remote?.data)return;
    const previousBaseline=studioBaselineData?studioClone(studioBaselineData):studioClone(state||{});
    const localCurrent=studioClone(state||{});
    const localDirty=!studioSame(previousBaseline,localCurrent);
    state=localDirty?studioMergeThreeWay(remote.data,previousBaseline,localCurrent):remote.data;
    studioSetBaseline(remote.data,remote.updatedAt);
    writeLocalWorkspace(currentWorkspaceId,state);
    ensureToolData();ensureApplicationsData();ensurePersonnelData();ensureStrategicGoalsData();ensureStrategicArchiveData();
    if(document.getElementById('pageRoot')){renderPage();syncAnnounceWidget(false);}
    refreshOpenPersonDetailReadonly();
  }catch(e){console.warn('多人同步检查失败',e);}
  finally{studioLiveSyncBusy=false;}
}
function startWorkspaceLiveSync(){stopWorkspaceLiveSync();studioLiveSyncTimer=setInterval(studioPullRemoteIfChanged,2200);}

async function saveIdentity(id){identity=normalizeAccountId(id)||null;try{if(identity)sessionStorage.setItem(IDENTITY_LOCAL_KEY,identity);else sessionStorage.removeItem(IDENTITY_LOCAL_KEY);localStorage.removeItem(IDENTITY_LOCAL_KEY);}catch(e){}return true;}

function getPersonnel(id){ const target=normalizeAccountId(id); return state.personnel.find(p=>normalizeAccountId(p.id)===target); }
function isCurrentAdmin(){
  const p = getPersonnel(identity);
  return !!(p && p.isAdmin);
}
function canManagePersonnel(){
  // 空团队允许首位成员完成初始化；首位加入者会自动成为唯一管理员。
  return isCurrentAdmin() || state.personnel.length===0;
}

// 工具看板数据兼容：老版本只有 tools，没有分类字段。
function ensureToolData(){
  if(!Array.isArray(state.toolCategories)) state.toolCategories = [];
  if(!Array.isArray(state.tools)) state.tools = [];
  state.tools.forEach(tool=>{
    if(!Object.prototype.hasOwnProperty.call(tool,'categoryId')) tool.categoryId = null;
  });
  if(!Array.isArray(state.homeToolOrder)) state.homeToolOrder = state.tools.map(t=>t.id);
  const existingIds = new Set(state.tools.map(t=>t.id));
  state.homeToolOrder = state.homeToolOrder.filter(id=>existingIds.has(id));
  state.tools.forEach(t=>{ if(!state.homeToolOrder.includes(t.id)) state.homeToolOrder.push(t.id); });
}
function dashboardOrderedTools(){
  ensureToolData();
  const rank = new Map(state.homeToolOrder.map((id,index)=>[id,index]));
  return state.tools.slice().sort((a,b)=>(rank.get(a.id)??999999)-(rank.get(b.id)??999999));
}


const APPLICATION_TYPES = {
  collab:{label:'协作', fullLabel:'协作申请', cls:'app-type-collab'},
  expense:{label:'费用', fullLabel:'费用申请', cls:'app-type-expense'},
  project:{label:'立项', fullLabel:'项目立项审批', cls:'app-type-project'},
  leave:{label:'请假/外出', fullLabel:'请假/外出申请', cls:'app-type-leave'},
};
function ensureApplicationsData(){
  if(!Array.isArray(state.collaborations)) state.collaborations = [];
  state.collaborations.forEach(c=>{
    if(!c.type) c.type = 'collab';
    if(!c.data){
      c.data = {
        background:c.background || '', purpose:c.purpose || '', request:c.request || '',
        deadline:c.deadline || '', benefit:c.benefit || ''
      };
    }
    if(!c.status) c.status = '待审批';
    if(!c.ts) c.ts = Date.now();
  });
}
function applicationMeta(c){ return APPLICATION_TYPES[c?.type] || APPLICATION_TYPES.collab; }
function applicationData(c){ return c?.data || {}; }
function applicationSubmittedTime(ts){
  if(!ts) return '-';
  return new Date(ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function applicationTitle(c){
  const d = applicationData(c);
  if(c.type==='expense') return d.reason || '费用申请';
  if(c.type==='project') return d.projectName || '项目立项';
  if(c.type==='leave') return `${d.leaveType || '请假/外出'}${d.reason ? ' · '+d.reason : ''}`;
  return d.purpose || '协作申请';
}
function applicationDetailFields(c){
  const d = applicationData(c);
  const field = (k,v,full=false)=>`<div class="collab-field ${full?'full':''}"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v || '-')}</div></div>`;
  if(c.type==='expense'){
    return [
      field('费用事由',d.reason,true),
      field('金额',d.amount ? `¥ ${Number(d.amount).toLocaleString('zh-CN',{maximumFractionDigits:2})}` : '-'),
      field('费用类别',d.category),
      field('期望支付时间',d.expectedPaymentDate ? fmtDate(d.expectedPaymentDate) : '-'),
      field('备注说明',d.note || '—',true),
    ].join('');
  }
  if(c.type==='project'){
    return [
      field('项目名称',d.projectName,true),
      field('背景与目标',d.backgroundGoal,true),
      field('所需资源',d.resources,true),
      field('预计周期',`${d.startDate ? fmtDate(d.startDate) : '-'} — ${d.endDate ? fmtDate(d.endDate) : '-'}`),
      field('预期成果',d.expectedOutcome,true),
    ].join('');
  }
  if(c.type==='leave'){
    const start = d.startTime ? new Date(d.startTime).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
    const end = d.endTime ? new Date(d.endTime).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
    return [
      field('类型',d.leaveType || '请假/外出'),
      field('时间',`${start} — ${end}`),
      field('事由',d.reason,true),
      field('外出地点',d.location || '—'),
      field('备注说明',d.note || '—',true),
    ].join('');
  }
  return [
    field('背景',d.background,true),
    field('目的',d.purpose,true),
    field('具体需要对方做什么',d.request,true),
    field('截止时间',d.deadline ? fmtDate(d.deadline) : '-'),
    field('对公司的好处',d.benefit,true),
  ].join('');
}

const HOME_NOTIFICATION_TYPES = new Set(['manual','strategic_goal','personnel_join']);
function isHomeNotification(n){
  return !!(n && HOME_NOTIFICATION_TYPES.has(n.type));
}
function homeNotificationTs(n){
  // 公告更新用 editedAt 作为本次通知时间，但保留原公告发布时间 ts。
  return Number((n && n.editedAt) || (n && n.ts) || 0);
}
function homeNotifications(recentOnly=false){
  const now = Date.now();
  return (state.notifications || [])
    .filter(n=>isHomeNotification(n) && (!recentOnly || now - homeNotificationTs(n) <= 2*24*3600*1000))
    .sort((a,b)=>homeNotificationTs(b)-homeNotificationTs(a));
}

function ensurePersonnelData(){
  if(!Array.isArray(state.personnel)) state.personnel = [];
  state.personnel.forEach(person=>{
    if(!person.status) person.status = '工作中';
    if(!Array.isArray(person.tags)) person.tags = [];
    if(typeof person.avatar !== 'string') person.avatar = '';
    if(typeof person.contact !== 'string') person.contact = person.contact || '';
    person.isAdmin = !!person.isAdmin;
  });

  // 单管理员制：已有团队若没有管理员，默认第一位成员为管理员；
  // 若历史数据里存在多个管理员，只保留最先出现的一位。
  if(state.personnel.length){
    let primaryAdmin = state.personnel.find(person=>person.isAdmin) || state.personnel[0];
    state.personnel.forEach(person=>{ person.isAdmin = person.id===primaryAdmin.id; });
  }
}
function ensureStrategicGoalsData(){
  if(!Array.isArray(state.strategicGoals)) state.strategicGoals = [];
  state.strategicGoals = state.strategicGoals.filter(goal=>goal && goal.id && goal.name && goal.deadline);
  state.strategicGoals.forEach(goal=>{
    if(!goal.createdAt) goal.createdAt = Date.now();
  });
  const validIds = new Set(state.strategicGoals.map(goal=>goal.id));
  (state.projects || []).forEach(proj=>{
    (proj.members || []).forEach(member=>{
      (member.goals || []).forEach(goal=>{
        if(goal.strategicGoalId && !validIds.has(goal.strategicGoalId)){
          delete goal.strategicGoalId;
          delete goal.strategicLinkedAt;
        }
        // 老数据没有开始日期时，优先用关联战略目标的时间；否则从今天开始。
        // 若目标已过期，则避免开始日期晚于截止日期。
        if(!goal.startDate && goal.deadline){
          const deadlineDay = new Date(goal.deadline+'T00:00:00');
          let startDay = goal.strategicLinkedAt ? new Date(Number(goal.strategicLinkedAt)) : new Date();
          startDay.setHours(0,0,0,0);
          if(!Number.isNaN(deadlineDay.getTime()) && startDay > deadlineDay) startDay = deadlineDay;
          goal.startDate = startDay.toISOString().slice(0,10);
        }
        if(goal.startDate && goal.deadline && goal.startDate > goal.deadline) goal.startDate = goal.deadline;
      });
    });
  });
}
function strategicGoalName(id){
  return state.strategicGoals.find(goal=>goal.id===id)?.name || '';
}
function strategicLinkOptions(selectedId, emptyLabel='关联战略目标'){
  ensureStrategicGoalsData();
  return `<option value="" ${!selectedId?'selected':''}>${escapeHtml(emptyLabel)}</option>` +
    state.strategicGoals
      .slice()
      .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))
      .map(goal=>`<option value="${goal.id}" ${selectedId===goal.id?'selected':''}>${escapeHtml(goal.name)}</option>`)
      .join('');
}
function strategicAssignments(strategicGoalId){
  const people = new Map();
  (state.projects || []).forEach(proj=>{
    (proj.members || []).forEach(member=>{
      const linked = (member.goals || []).filter(goal=>goal.strategicGoalId===strategicGoalId);
      if(!linked.length) return;
      const person = member.personnelId ? getPersonnel(member.personnelId) : null;
      const key = member.personnelId || `${proj.id}|${member.id}`;
      if(!people.has(key)){
        people.set(key, {
          key,
          personnelId:member.personnelId || '',
          name:person?.name || member.name || '未命名成员',
          position:person?.position || member.role || '',
          tasks:[]
        });
      }
      linked.forEach(goal=>people.get(key).tasks.push({proj, member, goal}));
    });
  });
  return [...people.values()]
    .map(person=>({
      ...person,
      tasks:person.tasks.sort((a,b)=>new Date(a.goal.startDate||a.goal.deadline)-new Date(b.goal.startDate||b.goal.deadline) || new Date(a.goal.deadline)-new Date(b.goal.deadline))
    }))
    .sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
}

function ensureStrategicArchiveData(){
  if(!Array.isArray(state.strategicGoalArchives)) state.strategicGoalArchives = [];
}
function strategicGoalExecutionProgress(goal){
  const assignments = strategicAssignments(goal.id);
  const tasks = assignments.flatMap(person=>person.tasks.map(item=>item.goal));
  if(!tasks.length) return 0;
  return Math.round(tasks.reduce((sum,task)=>sum+goalProgressValue(task),0)/tasks.length);
}
function strategicArchiveOutcome(goal, people, archivedAt, reason){
  const tasks = people.flatMap(person=>person.tasks || []);
  const unfinished = tasks.filter(task=>Number(task.progress||0)<100 && task.status!=='已完成');
  if(reason==='到期自动归档' && unfinished.length){
    return {text:`到期未完成 · ${unfinished.length} 项`, cls:'unfinished'};
  }
  if(!tasks.length){
    return {text:reason==='到期自动归档'?'到期归档 · 无关联任务':'已确认完成', cls:reason==='到期自动归档'?'unfinished':''};
  }

  // 只有真实存在且有效的完成时间才参与计算；null 不能被 Number(null) 当作 0（1970-01-01）。
  const completedTimes = tasks
    .map(task=>task.completedAt)
    .filter(ts=>ts!==null && ts!==undefined && ts!=='')
    .map(ts=>Number(ts))
    .filter(ts=>Number.isFinite(ts) && ts>0);

  const archivedTs = Number(archivedAt);
  const fallbackTs = Number.isFinite(archivedTs) && archivedTs>0 ? archivedTs : Date.now();
  const allTasksHaveCompletionTime = completedTimes.length===tasks.length;
  const compareTs = allTasksHaveCompletionTime ? Math.max(...completedTimes) : fallbackTs;

  // 用“自然日”做差，避免时分秒和时区造成 ±1 天误差。
  const doneDate = new Date(compareTs);
  const deadlineMatch = String(goal.deadline||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(Number.isNaN(doneDate.getTime()) || !deadlineMatch){
    return {text:unfinished.length?`已归档 · ${unfinished.length} 项未完成`:'已归档', cls:unfinished.length?'unfinished':''};
  }
  const doneDay = Date.UTC(doneDate.getFullYear(), doneDate.getMonth(), doneDate.getDate());
  const deadlineDay = Date.UTC(Number(deadlineMatch[1]), Number(deadlineMatch[2])-1, Number(deadlineMatch[3]));
  const diff = Math.round((deadlineDay-doneDay)/86400000);
  let text = diff>0?`提前 ${diff} 天完成`:diff<0?`延期 ${Math.abs(diff)} 天完成`:'按期完成';
  if(unfinished.length) text += ` · ${unfinished.length} 项未完成`;
  return {text, cls:unfinished.length?'unfinished':''};
}
function strategicArchiveDisplayOutcome(archive){
  if(!archive) return {text:'已归档', cls:''};
  return strategicArchiveOutcome(
    {deadline:archive.deadline},
    Array.isArray(archive.people)?archive.people:[],
    archive.archivedAt,
    archive.archiveReason || '归档'
  );
}
function buildStrategicArchiveSnapshot(goal, reason='确认完成'){
  const archivedAt = Date.now();
  const people = strategicAssignments(goal.id).map(person=>({
    personnelId:person.personnelId || '',
    name:person.name || '',
    position:person.position || '',
    tasks:person.tasks.map(({goal:task})=>({
      id:task.id,
      content:task.content || '',
      startDate:task.startDate || task.deadline || '',
      deadline:task.deadline || '',
      priority:task.priority || '一般',
      status:task.status || statusFromProgress(goalProgressValue(task)),
      progress:goalProgressValue(task),
      completedAt:task.completedAt || null,
      completionTiming:task.status==='已完成' || goalProgressValue(task)>=100 ? completionTiming(task).text : '未完成'
    }))
  }));
  const outcome = strategicArchiveOutcome(goal, people, archivedAt, reason);
  return {
    id:'sga_'+uid(), strategicGoalId:goal.id, name:goal.name, deadline:goal.deadline,
    createdAt:goal.createdAt || null, archivedAt, archiveReason:reason,
    outcome:outcome.text, outcomeClass:outcome.cls, people
  };
}
async function archiveStrategicGoalById(goalId, reason='确认完成', shouldRender=true){
  ensureStrategicArchiveData();
  const goal = state.strategicGoals.find(item=>item.id===goalId);
  if(!goal) return null;
  const snapshot = buildStrategicArchiveSnapshot(goal, reason);
  state.strategicGoalArchives.push(snapshot);
  state.strategicGoals = state.strategicGoals.filter(item=>item.id!==goalId);
  (state.projects || []).forEach(proj=>(proj.members || []).forEach(member=>(member.goals || []).forEach(task=>{
    if(task.strategicGoalId===goalId){
      delete task.strategicGoalId;
      delete task.strategicLinkedAt;
    }
  })));
  expandedStrategicGantt.delete(goalId);
  await saveData();
  if(shouldRender) renderPage();
  return snapshot;
}
async function autoArchiveDueStrategicGoals(){
  ensureStrategicArchiveData();
  ensureStrategicGoalsData();
  const now = Date.now();
  const dueIds = state.strategicGoals.filter(goal=>{
    const dueEnd = new Date(goal.deadline+'T23:59:59').getTime();
    return Number.isFinite(dueEnd) && now > dueEnd;
  }).map(goal=>goal.id);
  for(const id of dueIds) await archiveStrategicGoalById(id,'到期自动归档',false);
  return dueIds.length;
}

function archiveTaskRows(archive){
  return (archive.people || []).flatMap(person=>(person.tasks || []).map(task=>({person,task})));

function renderStrategicArchiveGantt(archive){
  const people=(archive.people || []).filter(person=>(person.tasks || []).length);
  if(!people.length) return `<div class="studio-gantt-empty">归档时没有关联任务</div>`;
  const tasks=people.flatMap(person=>person.tasks || []);
  const starts=tasks.map(t=>strategicGanttDateMs(t.startDate||t.deadline,false)).filter(Number.isFinite);
  const ends=tasks.map(t=>strategicGanttDateMs(t.deadline,true)).filter(Number.isFinite);
  const targetMs=strategicGanttDateMs(archive.deadline,true);
  let startMs=starts.length?Math.min(...starts):targetMs-86400000;
  let endMs=ends.length?Math.max(...ends):targetMs;
  if(Number.isFinite(targetMs)) endMs=Math.max(endMs,targetMs);
  if(endMs<=startMs) endMs=startMs+86400000;
  const span=endMs-startMs;
  const pct=ms=>Math.max(0,Math.min(100,((ms-startMs)/span)*100));
  const targetPct=pct(targetMs);
  const layoutSegments=(tasks)=>{
    const laneEnds=[];
    return {segments:tasks.slice().sort((a,b)=>new Date(a.startDate)-new Date(b.startDate)).map(task=>{
      const start=strategicGanttDateMs(task.startDate||task.deadline,false);
      const end=strategicGanttDateMs(task.deadline,true);
      let lane=laneEnds.findIndex(last=>Number.isFinite(start)&&start>last);
      if(lane<0) lane=laneEnds.length;
      laneEnds[lane]=Number.isFinite(end)?end:start;
      return {...task,lane};
    }),laneCount:Math.max(1,laneEnds.length)};
  };
  return `<div class="studio-gantt-panel strategic-archive-gantt">
    <div class="studio-gantt-head"><span class="studio-gantt-head-title">归档甘特图</span><span class="studio-gantt-range">${strategicGanttDateLabel(startMs)} — ${strategicGanttDateLabel(endMs)}</span></div>
    <div class="studio-gantt-scale"><span class="studio-gantt-scale-target ${targetPct<8?'edge-left':targetPct>92?'edge-right':''}" style="left:${targetPct}%">战略目标 ${strategicGoalDateLabel(archive.deadline).replace(' 目标','')}</span></div>
    <div class="studio-gantt-people">${people.map(person=>{
      const layout=layoutSegments(person.tasks||[]), lanePitch=34, trackHeight=layout.laneCount*lanePitch+6;
      return `<div class="studio-gantt-person-row">
        <div class="studio-gantt-person">${avatarHtml(person.personnelId,person.name,'sm')}<div class="studio-gantt-person-meta"><div class="studio-gantt-person-name">${escapeHtml(person.name)}</div>${person.position?`<div class="studio-gantt-person-role">${escapeHtml(person.position)}</div>`:''}</div></div>
        <div class="studio-gantt-task-stack"><div class="studio-gantt-person-track-wrap"><div class="studio-gantt-person-track ${layout.laneCount>1?'multi-lane':''}" style="height:${trackHeight}px"><span class="studio-gantt-target-line" style="left:${targetPct}%"></span>${layout.segments.map(task=>{
          const start=strategicGanttDateMs(task.startDate||task.deadline,false), end=strategicGanttDateMs(task.deadline,true);
          const left=pct(start), right=pct(end), width=Math.max(2.5,right-left), top=task.lane*lanePitch+16;
          return `<span class="studio-gantt-person-bar ${strategicGanttStatusClass(task.status)}" style="left:${left}%;width:${width}%;top:${top}px" title="${escapeHtml(task.content)}"><span class="studio-gantt-person-bar-label">${escapeHtml(task.content)}</span><span class="studio-gantt-person-bar-dates">${escapeHtml(fmtDateShort(task.startDate))}—${escapeHtml(fmtDateShort(task.deadline))}</span></span>`;
        }).join('')}</div></div></div>
      </div>`;
    }).join('')}</div>
  </div>`;
}

function restoreStrategicArchiveById(archiveId){
  ensureStrategicArchiveData();
  ensureStrategicGoalsData();
  const archive=state.strategicGoalArchives.find(item=>item.id===archiveId);
  if(!archive) return false;
  const goalId=archive.strategicGoalId || ('sg_'+uid());
  if(state.strategicGoals.some(goal=>goal.id===goalId)){
    showToast('该战略目标已在进行中');
    return false;
  }
  state.strategicGoals.push({
    id:goalId,
    name:archive.name || '未命名战略目标',
    deadline:archive.deadline || todayISO(),
    createdAt:archive.createdAt || Date.now(),
    restoredAt:Date.now()
  });
  const archivedTaskIds=new Set(archiveTaskRows(archive).map(({task})=>task && task.id).filter(Boolean));
  (state.projects || []).forEach(proj=>{
    (proj.members || []).forEach(member=>{
      (member.goals || []).forEach(task=>{
        if(archivedTaskIds.has(task.id)){
          task.strategicGoalId=goalId;
          task.strategicLinkedAt=Date.now();
        }
      });
    });
  });
  state.strategicGoalArchives=state.strategicGoalArchives.filter(item=>item.id!==archiveId);
  return true;
}

function strategicGanttStatusClass(status){
  if(status==='已完成') return 'done';
  if(status==='即将完成') return 'soon';
  if(status==='推进中') return 'doing';
  return 'todo';
}
function strategicGanttDateMs(iso, endOfDay=false){
  const d = new Date(`${iso}T${endOfDay?'23:59:59':'00:00:00'}`);
  return Number.isNaN(d.getTime()) ? NaN : d.getTime();
}
function strategicGanttDateLabel(ms){
  const d = new Date(ms);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function renderStrategicGantt(goal){
  const people = strategicAssignments(goal.id);
  if(!people.length){
    return `<div class="studio-gantt-empty">还没有关联任务。可在「项目管理」的目标右侧选择“关联战略目标”。</div>`;
  }

  const allTasks = people.flatMap(person=>person.tasks);
  const targetMs = strategicGanttDateMs(goal.deadline, true);
  const taskStarts = allTasks
    .map(({goal:task})=>strategicGanttDateMs(task.startDate || task.deadline, false))
    .filter(Number.isFinite);
  const taskEnds = allTasks
    .map(({goal:task})=>strategicGanttDateMs(task.deadline, true))
    .filter(Number.isFinite);

  let startMs = taskStarts.length ? Math.min(...taskStarts) : new Date().setHours(0,0,0,0);
  let endMs = taskEnds.length ? Math.max(...taskEnds) : startMs + 86400000;
  if(Number.isFinite(targetMs)) endMs = Math.max(endMs, targetMs);
  if(endMs <= startMs) endMs = startMs + 86400000;

  const span = endMs - startMs;
  const pct = ms=>Math.max(0, Math.min(100, ((ms-startMs)/span)*100));
  const targetPct = Number.isFinite(targetMs) ? pct(targetMs) : 100;
  const todayMs = new Date().setHours(12,0,0,0);
  const todayPct = pct(todayMs);
  const showToday = todayMs >= startMs && todayMs <= endMs;

  // 同一个人同一截止日的任务合并成一个时间段，任务名用顿号连接。
  // 这样一人始终只占一行，不会把多个任务堆成多根独立进度条。
  const personSegments = person=>{
    const byDeadline = new Map();
    person.tasks.forEach(({goal:task})=>{
      const key = task.deadline || '';
      if(!byDeadline.has(key)) byDeadline.set(key, []);
      byDeadline.get(key).push(task);
    });
    return [...byDeadline.entries()].map(([deadline,tasks])=>{
      const starts = tasks.map(task=>task.startDate || task.deadline).filter(Boolean).sort();
      const startDate = starts[0] || deadline;
      const names = [...new Set(tasks.map(task=>task.content).filter(Boolean))];
      const statuses = tasks.map(task=>task.status);
      let status = '待开始';
      if(statuses.every(v=>v==='已完成')) status='已完成';
      else if(statuses.some(v=>v==='即将完成')) status='即将完成';
      else if(statuses.some(v=>v==='推进中')) status='推进中';
      return {startDate, deadline, name:names.join('、'), status};
    }).sort((a,b)=>new Date(a.startDate)-new Date(b.startDate) || new Date(a.deadline)-new Date(b.deadline));
  };

  // 同一人的任务如果时间区间相交，自动分配到同一人员行里的不同细轨道。
  // 不相交的任务仍使用第一轨；这样避免颜色叠在一起，同时保持“一人一行”。
  const layoutPersonSegments = segments=>{
    const laneEnds = [];
    const laidOut = segments.map(seg=>{
      const start = strategicGanttDateMs(seg.startDate,false);
      const end = strategicGanttDateMs(seg.deadline,true);
      let lane = laneEnds.findIndex(lastEnd=>Number.isFinite(start) && start > lastEnd);
      if(lane < 0) lane = laneEnds.length;
      laneEnds[lane] = Number.isFinite(end) ? end : start;
      return {...seg,lane};
    });
    return {segments:laidOut,laneCount:Math.max(1,laneEnds.length)};
  };

  return `
    <div class="studio-gantt-panel">
      <div class="studio-gantt-head">
        <span class="studio-gantt-head-title">执行甘特图</span>
        <span class="studio-gantt-range">${strategicGanttDateLabel(startMs)} — ${strategicGanttDateLabel(endMs)}</span>
      </div>
      <div class="studio-gantt-scale" aria-hidden="true">
        ${showToday ? `<span class="studio-gantt-scale-today ${todayPct < 8 ? 'edge-left' : todayPct > 92 ? 'edge-right' : ''}" style="left:${todayPct}%">今天</span>` : ''}
        <span class="studio-gantt-scale-target ${targetPct < 8 ? 'edge-left' : targetPct > 92 ? 'edge-right' : ''}" style="left:${targetPct}%">战略目标 ${strategicGoalDateLabel(goal.deadline).replace(' 目标','')}</span>
      </div>
      <div class="studio-gantt-people">
        ${people.map(person=>{
          const layout = layoutPersonSegments(personSegments(person));
          const segments = layout.segments;
          const laneCount = layout.laneCount;
          const lanePitch = 34;
          const trackHeight = laneCount * lanePitch + 6;
          return `
            <div class="studio-gantt-person-row">
              <div class="studio-gantt-person">
                ${avatarHtml(person.personnelId, person.name,'sm')}
                <div class="studio-gantt-person-meta">
                  <div class="studio-gantt-person-name">${escapeHtml(person.name)}</div>
                  ${person.position ? `<div class="studio-gantt-person-role">${escapeHtml(person.position)}</div>` : ''}
                </div>
              </div>
              <div class="studio-gantt-task-stack">
                <div class="studio-gantt-person-track-wrap">
                  <div class="studio-gantt-person-track ${laneCount>1?'multi-lane':''}" style="height:${trackHeight}px">
                    <span class="studio-gantt-target-line" style="left:${targetPct}%"></span>
                    ${showToday ? `<span class="studio-gantt-today-line" style="left:${todayPct}%"></span>` : ''}
                    ${segments.map(seg=>{
                      const rawStart = strategicGanttDateMs(seg.startDate,false);
                      const rawEnd = strategicGanttDateMs(seg.deadline,true);
                      const taskStart = Number.isFinite(rawStart) ? rawStart : startMs;
                      const taskEnd = Number.isFinite(rawEnd) ? Math.max(taskStart,rawEnd) : taskStart;
                      const left = pct(taskStart);
                      const right = pct(taskEnd);
                      const width = Math.max(2.5,right-left);
                      const dateText = `${fmtDateShort(seg.startDate)}—${fmtDateShort(seg.deadline)}`;
                      const top = seg.lane * lanePitch + 16;
                      return `<span class="studio-gantt-person-bar ${strategicGanttStatusClass(seg.status)}" style="left:${left}%;width:${width}%;top:${top}px" title="${escapeHtml(seg.name)}｜${escapeHtml(dateText)}">
                        <span class="studio-gantt-person-bar-label">${escapeHtml(seg.name)}</span>
                        <span class="studio-gantt-person-bar-dates">${escapeHtml(dateText)}</span>
                      </span>`;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

let announceOpen = false;
function computeUnread(){
  return homeNotifications(false).filter(n=>!readIds.includes(n.id)).sort((a,b)=>homeNotificationTs(a)-homeNotificationTs(b));
}
async function markAllRead(list){
  if(!list.length) return;
  const ids = list.map(n=>n.id);
  readIds = Array.from(new Set([...readIds, ...ids]));
  await saveReadIds();
}
function hideAnnounceWidget(){
  const w = document.getElementById('announceWidget');
  if(w) w.remove();
}
// 进入主页时只同步未读状态，不自动展开公告面板。
// 这样导航点击不会在同一次事件冒泡中把未读通知误标为已读；
// 只有用户主动打开铃铛并关闭面板后，才会标记为已读。
function syncAnnounceWidget(autoCheck){
  if(currentPage !== 'dashboard'){ hideAnnounceWidget(); return; }
  if(autoCheck) announceOpen = false;
  renderAnnounceWidget();
}
// 关闭对话框时才把当下看到的消息标记为已读，这样打开时未读小红点能正常显示
function closeAnnouncePanel(){
  announceOpen = false;
  const unread = computeUnread();
  renderAnnounceWidget();
  if(unread.length){
    markAllRead(unread).then(renderAnnounceWidget);
  }
}
function renderAnnounceWidget(){
  if(currentPage !== 'dashboard') return;
  const host = document.getElementById('dashboardClockCard') || document.body;
  let widget = document.getElementById('announceWidget');
  if(!widget){
    widget = document.createElement('div');
    widget.id = 'announceWidget';
    host.appendChild(widget);
  }else if(widget.parentElement !== host){
    host.appendChild(widget);
  }
  const unread = computeUnread();
  const hasUnread = unread.length > 0;
  const list = homeNotifications(false).slice(0,20);
  widget.innerHTML = `
    <div class="announce-panel ${announceOpen?'open':''}" id="announcePanel">
      <div class="announce-head">
        <span>通知</span>
        <span class="announce-close" id="announceClose">×</span>
      </div>
      <div class="announce-list">
        ${list.length ? list.map(n=>{
          const isUnread = !readIds.includes(n.id);
          return `
          <div class="announce-item ${isUnread?'unread':''}">
            <div class="announce-content">${isUnread?'<span class="announce-dot-mark"></span>':''}${escapeHtml(n.content)}</div>
            <div class="announce-time">${new Date(n.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
          </div>`;
        }).join('') : `<div class="announce-empty">暂无通知</div>`}
      </div>
    </div>
    <div class="announce-fab" id="announceFab" title="通知">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      ${hasUnread ? '<span class="announce-dot"></span>' : ''}
    </div>
  `;
  document.getElementById('announceFab').onclick = (e)=>{
    e.stopPropagation();
    if(announceOpen){ closeAnnouncePanel(); }
    else { announceOpen = true; renderAnnounceWidget(); }
  };
  document.getElementById('announceClose').onclick = (e)=>{
    e.stopPropagation();
    closeAnnouncePanel();
  };
}

  });

async function markTeamAnnouncementsRead(){

  let changed = false;
  (state.notifications || []).forEach(n=>{
    if(n.type!=='manual') return;
    if(!Array.isArray(n.readBy)) n.readBy = [];
    if(!n.readBy.includes(identity)){

      changed = true;
    }
  });
  if(changed) await saveData();
  refreshTeamAttentionBadges();
}

      navigate(target);
    });
  });

  if(homeBrandEntry){
    homeBrandEntry.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){
        e.preventDefault();
        navigate('dashboard');
      }
    });
  }
  app.querySelectorAll('[data-hr-nav]').forEach(el=>{
    el.addEventListener('click', ()=> navigate(el.dataset.hrNav));
  });
  const identityBtn = app.querySelector('#identitySwitchBtn');
  const identityMenu = app.querySelector('#identitySwitchMenu');
  if(identityBtn){
    identityBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!identity){
        openAccountLoginModal({force:true});
        return;
      }
      if(identityMenu) identityMenu.classList.toggle('open');
    });
  }
  const reloginBtn = app.querySelector('#accountReloginBtn');
  if(reloginBtn) reloginBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(identityMenu) identityMenu.classList.remove('open');
    openAccountLoginModal({force:false, switchMode:true});
  });
  const logoutBtn = app.querySelector('#accountLogoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(identityMenu) identityMenu.classList.remove('open');
    if(state && currentWorkspaceId){ await saveData(); await studioFlushBeforeSwitch(); }
    await studioAuthSignOut();
    await saveIdentity('');
    currentWorkspaceId = null;
    state = null;
    readIds = [];
    currentPage = 'dashboard';
    document.getElementById('app').innerHTML = '';
    hideAnnounceWidget();
    openAccountLoginModal({force:true});
  });
  renderPage();
}

document.addEventListener('click', ()=>{
  const menu = document.getElementById('identitySwitchMenu');
  if(menu) menu.classList.remove('open');
});

function navigate(page){
  if(!identity){
    openAccountLoginModal({force:true});
    return;
  }
  if(page==='personnel' && !canManagePersonnel()){
    showToast('人员管理仅管理员可使用');
    page = 'notify';
  }
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>{
    const key = el.dataset.nav;
    el.classList.toggle('active', key==='profile' ? HR_PAGES.includes(page) : key===page);
  });
  const hrSubnav = document.getElementById('hrSubnav');
  if(hrSubnav) hrSubnav.classList.toggle('show', HR_PAGES.includes(page));
  const hrWorkspace = document.getElementById('hrWorkspace');
  if(hrWorkspace) hrWorkspace.classList.toggle('hr-active', HR_PAGES.includes(page));
  document.querySelectorAll('[data-hr-nav]').forEach(el=>{
    el.classList.toggle('active', el.dataset.hrNav===page);
  });
  renderPage();
  if(page==='notify'){
    // 进入团队公告即视为已经阅读当前公告；只清公告未读，不影响待审批数量。
    markTeamAnnouncementsRead();
  }
  syncAnnounceWidget(page==='dashboard');
}

function renderPage(){
  const root = document.getElementById('pageRoot');
  if(currentPage==='personnel' && !canManagePersonnel()) currentPage='notify';
  if(currentPage==='dashboard') root.innerHTML = pageDashboard();
  else if(currentPage==='projects') root.innerHTML = pageProjects();
  else if(currentPage==='profile') root.innerHTML = pageProfile();
  else if(currentPage==='personnel') root.innerHTML = pagePersonnel();
  else if(currentPage==='collab') root.innerHTML = pageCollab();
  else if(currentPage==='tools') root.innerHTML = pageTools();
  else if(currentPage==='notify') root.innerHTML = pageNotify();
  bindPageEvents();
  if(currentPage==='dashboard') renderCarouselFrame();
  refreshTeamAttentionBadges();
}

function pageDashboard(){
  const now = new Date();
  const weekMap = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const weekEnMap = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const weekStr = weekMap[now.getDay()];
  const weekEnStr = weekEnMap[now.getDay()];
  const timeStr = now.toTimeString().slice(0,5);
  const dateShort = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const fullDateSlash = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const hourDeg = ((now.getHours()%12) + now.getMinutes()/60) * 30;
  const minuteDeg = now.getMinutes() * 6;
  const greetingHour = now.getHours();
  const greetingEn = greetingHour < 12 ? 'Good morning' : (greetingHour < 18 ? 'Good afternoon' : 'Good evening');
  const greetingCn = greetingHour < 12 ? '早上好' : (greetingHour < 18 ? '下午好' : '晚上好');
  const greetingName = getPersonnel(identity)?.name || identity || '朋友';

  ensureStrategicGoalsData();
  const strategicGoals = state.strategicGoals
    .slice()
    .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));

  // 团队目标：按项目组分类；每个项目组内再按成员展示进行中的目标
  const projectGroups = state.projects
    .filter(proj=>!proj.completed)
    .map(proj=>{
      const members = proj.members.map(m=>{
        const goals = m.goals
          .filter(g=>g.status!=='已完成')
          .sort((a,b)=> priorityRank(b.priority) - priorityRank(a.priority) || new Date(a.deadline) - new Date(b.deadline));
        if(!goals.length) return null;
        const person = m.personnelId ? getPersonnel(m.personnelId) : null;
        return {
          member:m,
          name:m.name,
          signature:person?.signature || '',
          goals,
          maxPriority:Math.max(...goals.map(g=>priorityRank(g.priority))),
          nearestDeadline:Math.min(...goals.map(g=>new Date(g.deadline).getTime()))
        };
      }).filter(Boolean)
        .sort((a,b)=>b.maxPriority-a.maxPriority || a.nearestDeadline-b.nearestDeadline);
      const totalGoals = members.reduce((sum,m)=>sum+m.goals.length,0);
      const nearestDeadline = members.length
        ? Math.min(...members.map(m=>m.nearestDeadline))
        : Infinity;
      const maxPriority = members.length ? Math.max(...members.map(m=>m.maxPriority)) : 0;
      return {proj,members,totalGoals,nearestDeadline,maxPriority};
    })
    .filter(group=>group.totalGoals>0)
    .sort((a,b)=>b.maxPriority-a.maxPriority || a.nearestDeadline-b.nearestDeadline);

  const totalGoals = projectGroups.reduce((sum,group)=>sum+group.totalGoals,0);

  const recentNotifs = homeNotifications(true);

  return `
    <div class="dashboard-home-grid">
      <div class="dashboard-left">
        ${strategicGoals.length ? `
          <div class="section studio-strategy-section">
            <div class="section-title studio-strategy-title">
              <span>工作室目标</span>
              <button type="button" class="studio-strategy-manage" data-open-strategic-goals>管理</button>
            </div>
            <div class="studio-strategy-list">
              ${strategicGoals.slice(0,3).map(goal=>{
                const timeVisual = strategicGoalTimeVisual(goal);
                const executionProgress = strategicGoalProgress(goal);
                const expanded = expandedStrategicGantt.has(goal.id);
                return `
                  <div class="studio-strategy-item ${expanded?'expanded':''}">
                    <button type="button" class="studio-strategy-row" data-toggle-strategic-gantt="${goal.id}" aria-expanded="${expanded?'true':'false'}">
                      <span class="studio-strategy-time-avatar" title="${escapeHtml(timeVisual.full)} · 时间已过 ${timeVisual.pct}%" aria-label="${escapeHtml(timeVisual.full)}，时间已过 ${timeVisual.pct}%" style="background:conic-gradient(#F28A9F 0 ${timeVisual.pct}%, rgba(182,176,168,.18) ${timeVisual.pct}% 100%);">
                        <span class="studio-strategy-time-avatar-inner">${escapeHtml(timeVisual.short)}</span>
                      </span>
                      <span class="studio-strategy-main">
                        <span class="studio-strategy-name">${escapeHtml(goal.name)}</span>
                        <span class="studio-strategy-progress" role="img" aria-label="关联任务总体进度 ${executionProgress}%" title="关联任务总体进度 ${executionProgress}%"><span style="width:${executionProgress}%"></span></span>
                      </span>
                    </button>
                    ${expanded ? renderStrategicGantt(goal) : ''}
                  </div>`;
              }).join('')}
            </div>
          </div>
        ` : `
          <button type="button" class="studio-strategy-empty" data-open-strategic-goals>＋ 设置工作室战略目标</button>
        `}

        ${projectGroups.length ? projectGroups.map(({proj,members,totalGoals:projectGoalCount})=>`
          <div class="section dashboard-goals-section">
            <div class="section-title"><span>${escapeHtml(proj.name)}</span><span class="count">${projectGoalCount} 项进行中</span></div>
            <div class="goal-grid">
              ${members.map(gr=>`
                <div class="goal-card">
                  <div class="who">
                    ${avatarHtml(gr.member.personnelId, gr.name,'sm')}
                    <div class="meta">
                      <div class="nm">${escapeHtml(gr.name)}</div>
                      ${gr.signature ? `<div class="rl">${escapeHtml(gr.signature)}</div>` : ''}
                    </div>
                  </div>
                  ${gr.goals.map(g=>{
                    const rem = remainingLabel(g.deadline);
                    const priority = g.priority || '一般';
                    return `
                    <div class="goal-item ${dashboardPriorityClass(priority)}" title="优先级：${priority}">
                      <div class="goal-item-top">
                        <div class="content">${escapeHtml(g.content)}</div>
                        <div class="dashboard-goal-inline">
                          <label class="dashboard-progress-control" title="拖动调整完成进度">
                            <input type="range" min="0" max="100" step="1" value="${goalProgressValue(g)}" data-dashboard-goal-progress="${proj.id}|${gr.member.id}|${g.id}" style="--p:${goalProgressValue(g)}%">
                            <span class="dashboard-progress-value" data-dashboard-progress-value="${proj.id}|${gr.member.id}|${g.id}">${Math.round(goalProgressValue(g))}%</span>
                          </label>
                          <span class="chip ${rem.cls}">${rem.text}</span>
                        </div>
                      </div>
                    </div>`;
                  }).join('')}
                </div>
              `).join('')}
            </div>
          </div>
        `).join('') : `<div class="section dashboard-goals-section"><div class="section-title"><span>项目目标</span><span class="count">0 项进行中</span></div><div class="empty">暂时没有进行中的目标</div></div>`}
      </div>

      <div class="dashboard-right">
        <div class="dashboard-notice-slot" id="carouselSlot"></div>

        <div class="dashboard-clock-card ref-time-widget" id="dashboardClockCard" aria-label="${dateStr} ${weekStr} ${timeStr}">
          <div class="clock-face" aria-hidden="true">
            <span class="clock-tick t12"></span>
            <span class="clock-tick t3"></span>
            <span class="clock-tick t6"></span>
            <span class="clock-tick t9"></span>
            <span class="clock-hand hour" style="transform:rotate(${hourDeg}deg)"></span>
            <span class="clock-hand minute" style="transform:rotate(${minuteDeg}deg)"></span>
            <span class="clock-center"></span>
          </div>
          <div class="clock-greeting">
            <div class="clock-greeting-en">${escapeHtml(greetingEn)}</div>
            <div class="clock-greeting-cn">${escapeHtml(greetingCn)}，${escapeHtml(greetingName)}</div>
          </div>
          <div class="clock-date">
            <div class="clock-lcd"><div class="clock-day">${timeStr}</div></div>
            <div class="clock-calendar-meta">
              <div class="clock-label">${weekEnStr}</div>
              <div class="clock-week">${fullDateSlash}</div>
            </div>
          </div>
        </div>

        <div class="dashboard-tools-card section">
          <div class="section-title"><span>工具链接</span><span class="count">${state.tools.length} 个</span></div>
          ${state.tools.length ? `<div class="tool-strip dashboard-tool-sortable">${dashboardOrderedTools().map(t=>`
            <a class="tool-chip" data-home-tool-id="${escapeHtml(t.id)}" draggable="false" href="${escapeHtml(t.url)}" target="_blank" rel="noopener noreferrer" title="拖动左侧圆点调整顺序">
              <span class="dotico home-tool-drag-handle" aria-label="拖动调整顺序" title="拖动调整顺序"></span>${escapeHtml(t.name)}
            </a>`).join('')}</div>` : `<div class="empty">还没有添加工具，去「工具管理」添加吧</div>`}
        </div>
      </div>
    </div>
  `;
}

function renderCarouselFrame(){
  const slot = document.getElementById('carouselSlot');
  if(!slot) return;
  const recentNotifs = homeNotifications(true);
  if(!recentNotifs.length){ slot.innerHTML=''; return; }
  if(carouselIdx >= recentNotifs.length) carouselIdx = 0;
  const n = recentNotifs[carouselIdx];
  slot.innerHTML = `
    <div class="carousel">
      <span class="dot-label">通知</span>
      <span class="msg">${escapeHtml(n.content)}</span>
      <span class="dots">${recentNotifs.map((_,i)=>`<span class="${i===carouselIdx?'on':''}"></span>`).join('')}</span>
    </div>
  `;
}
function startCarousel(){
  if(carouselTimer) clearInterval(carouselTimer);
  carouselTimer = setInterval(()=>{
    if(currentPage!=='dashboard') return;
    const recentNotifs = homeNotifications(true);
    if(!recentNotifs.length) return;
    carouselIdx = (carouselIdx + 1) % recentNotifs.length;
    renderCarouselFrame();
  }, 4200);
}

function refreshOpenPersonDetailReadonly(){
  const modal = document.querySelector('#modalRoot .modal[data-person-detail-id]');
  if(!modal) return;
  const person = getPersonnel(modal.dataset.personDetailId);
  if(!person) return;
  const contact = modal.querySelector('#personDetailContactReadonly');
  const status = modal.querySelector('#personDetailStatusReadonly');
  const tags = modal.querySelector('#personDetailTagsReadonly');
  if(contact) contact.textContent = person.contact || '—';
  if(status) status.textContent = person.status || '工作中';
  if(tags) tags.textContent = Array.isArray(person.tags) && person.tags.length ? person.tags.join('、') : '—';
}

let dashboardToolDragSuppressUntil = 0;
function bindDashboardToolSorting(root){
  const strip = root.querySelector('.dashboard-tool-sortable');
  if(!strip) return;
  const items = [...strip.querySelectorAll('[data-home-tool-id]')];
  items.forEach(item=>{
    const handle = item.querySelector('.home-tool-drag-handle');
    if(!handle) return;
    item.addEventListener('click',e=>{
      if(e.target.closest('.home-tool-drag-handle') || Date.now()<dashboardToolDragSuppressUntil){
        e.preventDefault();
        e.stopPropagation();
      }
    },true);
    item.addEventListener('dragstart',e=>e.preventDefault());
    handle.addEventListener('pointerdown',e=>{
      if(e.button!==undefined && e.button!==0) return;
      e.preventDefault();
      e.stopPropagation();
      const pointerId=e.pointerId;
      let finished=false;
      const startRect=item.getBoundingClientRect();
      const offsetX=e.clientX-startRect.left;
      const offsetY=e.clientY-startRect.top;
      const ghost=item.cloneNode(true);
      ghost.classList.remove('home-tool-dragging');
      ghost.classList.add('home-tool-drag-ghost');
      ghost.removeAttribute('href');
      ghost.removeAttribute('target');
      ghost.removeAttribute('rel');
      ghost.style.width=`${startRect.width}px`;
      ghost.style.height=`${startRect.height}px`;
      ghost.style.left=`${startRect.left}px`;
      ghost.style.top=`${startRect.top}px`;
      (strip.closest('.dashboard-tools-card') || document.body).appendChild(ghost);

      item.classList.add('home-tool-dragging');
      strip.classList.add('home-tool-sorting');
      if(handle.setPointerCapture){ try{handle.setPointerCapture(pointerId);}catch(_e){} }

      const moveGhost=(clientX,clientY)=>{
        ghost.style.left=`${clientX-offsetX}px`;
        ghost.style.top=`${clientY-offsetY}px`;
      };
      const cleanup=()=>{
        document.removeEventListener('pointermove',onMove,true);
        document.removeEventListener('pointerup',onUp,true);
        document.removeEventListener('pointercancel',onCancel,true);
        ghost.remove();
        if(handle.releasePointerCapture){ try{handle.releasePointerCapture(pointerId);}catch(_e){} }
      };
      const onMove=ev=>{
        if(ev.pointerId!==pointerId) return;
        ev.preventDefault();
        moveGhost(ev.clientX,ev.clientY);
        const others=[...strip.querySelectorAll('[data-home-tool-id]')].filter(el=>el!==item);
        let placed=false;
        for(const target of others){
          const rect=target.getBoundingClientRect();
          if(ev.clientY < rect.top + rect.height/2){
            if(item.nextElementSibling!==target) strip.insertBefore(item,target);
            placed=true;
            break;
          }
        }
        if(!placed && strip.lastElementChild!==item) strip.appendChild(item);
      };
      const finish=async(save)=>{
        if(finished) return;
        finished=true;
        cleanup();
        item.classList.remove('home-tool-dragging');
        strip.classList.remove('home-tool-sorting');
        dashboardToolDragSuppressUntil=Date.now()+350;
        if(save){
          const nextOrder=[...strip.querySelectorAll('[data-home-tool-id]')].map(el=>el.dataset.homeToolId);
          if(JSON.stringify(nextOrder)!==JSON.stringify(state.homeToolOrder)){
            state.homeToolOrder=nextOrder;
            await saveData();
            showToast('工具顺序已保存');
          }
        }else{
          renderPage();
        }
      };
      const onUp=ev=>{if(ev.pointerId===pointerId)finish(true);};
      const onCancel=ev=>{if(ev.pointerId===pointerId)finish(false);};
      document.addEventListener('pointermove',onMove,{capture:true,passive:false});
      document.addEventListener('pointerup',onUp,true);
      document.addEventListener('pointercancel',onCancel,true);
    });
  });
}

          closeModal();
          const remaining = member.goals.some(g=>g.status==='已完成');
          if(remaining) openDoneGoalsModal(pId,mId);
        });
      };
    });
  });
}

function compressAvatarFile(file){
  return new Promise((resolve,reject)=>{
    if(!file){ reject(new Error('请选择图片文件')); return; }
    const type = String(file.type || '').toLowerCase();
    const name = String(file.name || '').toLowerCase();
    const looksLikeImage = type.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|svg|avif|heic|heif)$/i.test(name);
    if(!looksLikeImage){ reject(new Error('请选择图片文件')); return; }
    if(file.size > 10*1024*1024){ reject(new Error('图片不能超过 10MB')); return; }

    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('图片读取失败'));
    reader.onload = ()=>{
      const raw = String(reader.result || '');
      if(!raw.startsWith('data:')){ reject(new Error('图片读取失败')); return; }
      if(type.includes('svg') || name.endsWith('.svg')){ resolve(raw); return; }

      const img = new Image();
      img.onload = ()=>{
        try{
          const naturalW = img.naturalWidth || img.width;
          const naturalH = img.naturalHeight || img.height;
          if(!naturalW || !naturalH) throw new Error('图片尺寸无效');
          const max = 360;
          const scale = Math.min(1, max / Math.max(naturalW, naturalH));
          const w = Math.max(1, Math.round(naturalW * scale));
          const h = Math.max(1, Math.round(naturalH * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          if(!ctx) throw new Error('当前浏览器无法处理图片');
          ctx.drawImage(img,0,0,w,h);
          let data='';
          try{ data = canvas.toDataURL('image/webp',.84); }catch(e){}
          if(!data || !data.startsWith('data:image/')) data = canvas.toDataURL('image/jpeg',.86);
          resolve(data);
        }catch(err){ reject(err); }
      };
      img.onerror = ()=>{
        if(type.includes('heic') || type.includes('heif') || /\.(heic|heif)$/i.test(name)){
          reject(new Error('当前浏览器暂不支持 HEIC/HEIF，请选择 JPG、PNG 或 WebP 图片'));
        }else{
          reject(new Error('图片读取失败，请换一张 JPG、PNG 或 WebP 图片'));
        }
      };
      img.src = raw;
    };
    reader.readAsDataURL(file);
  });
}
